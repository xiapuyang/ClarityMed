[project]
name = "claritymed"
version = "0.1.0"
description = "Patient-facing medical Q&A with structured uncertainty propagation."
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix-client>=2.7.0",
    "llama-index-core>=0.14.22",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "openinference-instrumentation-pydantic-ai>=0.1.16",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "pydantic>=2.9",
    "pydantic-ai-slim[anthropic,openai]>=1.0",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.18.0",
    "rich>=15.0.0",
    "sqlmodel>=0.0.22",
    "starlette>=0.41.0",
    "textual>=0.85,<1.0",
    "typer>=0.26.7",
]

[project.optional-dependencies]
# RAG inference servers (BGE-M3 embedder + bge-reranker-v2-m3). Optional
# because they pull in heavy ML deps (torch + FlagEmbedding ~2GB) that
# nobody needs unless they're hosting the servers themselves. Install
# with ``uv sync --extra rag-server``.
rag-server = [
    "FlagEmbedding>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# OpenAI Privacy Filter — model-based PII scrub layer (names, addresses,
# dates, secrets) that runs after the regex pass. ~1.5B params, CPU-only
# by default. Enable in configs/safety.yaml: phi.privacy_filter.enabled.
# Install with ``uv sync --extra privacy-filter``.
privacy-filter = [
    "transformers>=4.40",
    "onnxruntime>=1.17",
]

[project.scripts]
claritymed = "claritymed.cli.main:main"
# Long-running RAG servers — installed but only usable after
# `uv sync --extra rag-server` (FlagEmbedding + fastapi + uvicorn).
# Without the extra, invoking either prints a clear remediation hint
# and exits non-zero (see servers/embedder.py top-of-file try/except).
claritymed-embedder = "claritymed.servers.embedder:main"
claritymed-reranker = "claritymed.servers.reranker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claritymed"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
addopts = "--cov=src/claritymed --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/claritymed"]
