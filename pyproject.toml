[project]
name = "ClarityMed"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ClarityMed"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
addopts = "--cov=ClarityMed --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["serve.py"]
