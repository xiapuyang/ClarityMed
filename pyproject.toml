[project]
name = "claritymed"
version = "0.1.0"
description = "Patient-facing medical Q&A with structured uncertainty propagation."
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix-client>=2.7.0",
    # Cross-platform advisory file lock (fcntl on POSIX, msvcrt on Windows).
    # Used by manifest_store / blob_store / settings_store / session_attachments
    # for multi-process write safety. Drop-in replacement for the fcntl.flock
    # we sketched in the brainstorm; ~30KB pure-Python, MIT.
    "filelock>=3.13,<4",
    # Local PDF text extraction (the digital-PDF first leg of the PHI OCR
    # chain). Sub-100ms for typical reports, no model load. AGPLv3 —
    # acknowledged at plan time; self-hosted distribution stance.
    "pymupdf>=1.24,<2",
    "llama-index-core>=0.14.22",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "openinference-instrumentation-pydantic-ai>=0.1.16",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "pydantic>=2.9",
    "pydantic-ai-slim[anthropic,openai]>=1.0",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.18.0",
    "rich>=13.6.0",
    "sqlmodel>=0.0.22",
    "starlette>=0.41.0",
    "textual>=0.85,<1.0",
    # OpenAI Privacy Filter — model-based PII scrub layer (names, addresses,
    # dates, secrets) that runs after the regex pass. Default-on via
    # configs/safety.yaml: phi.privacy_filter.enabled. ONNX runtime is the
    # CPU inference backend; transformers provides the tokenizer.
    "transformers>=4.40",
    "onnxruntime>=1.17",
    # Filetype detection for extensionless paste targets (Dockerfile,
    # README without extension, raw clipboard bytes). Pure-local ONNX
    # inference on the onnxruntime above; ~3 MB package, ~1 MB bundled
    # model. PHI-safe by construction — never leaves the machine.
    "magika>=0.6",
    "typer>=0.26.7",
    # macOS-only: NSPasteboard access for the Ctrl+V screenshot path.
    # Without it _read_macos falls back to ``osascript "the clipboard as
    # text"`` which can't read image bytes — pasting a screenshot
    # silently produces nothing and CoreGraphics' jp2 stderr noise bleeds
    # into the Textual render.
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# RAG inference servers (BGE-M3 embedder + bge-reranker-v2-m3). Optional
# because they pull in heavy ML deps (torch + FlagEmbedding ~2GB) that
# nobody needs unless they're hosting the servers themselves. Install
# with ``uv sync --extra rag-server``.
rag-server = [
    "FlagEmbedding>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# Symptoms inference server (typed-BASD differential diagnosis). Optional
# because most ClarityMed users won't host the symptoms feature themselves.
# torch + numpy + scipy are already in the main deps via FlagEmbedding /
# scipy direct, so this extra only carries the FastAPI + httpx wire deps.
# Install with ``uv sync --extra symptoms-server``.
symptoms-server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]
# E2E quality evaluation — requires live local services (embedder + reranker +
# Qdrant) and the project's configured LLM. Run with:
#   uv sync --extra e2e
#   uv run pytest tests/e2e -v --no-cov
e2e = [
    "deepeval>=4.0",
    "httpx>=0.28.1",
    # Re-run failed e2e tests up to N times before reporting failure.
    # Required for the @pytest.mark.flaky(reruns=2, reruns_delay=5)
    # decorators in tests/e2e — without this plugin those marks are
    # silently no-ops and local-LLM variance (translation rewrites,
    # HyDE hypotheticals) shows up as spurious test failures.
    "pytest-rerunfailures>=15.0",
]
# MCQA evaluation — runs MedQA-USMLE (and follow-on CMB/MedMCQA/PubMedQA YAML
# tasks) through lm-evaluation-harness against any provider in models.yaml.
# Heavy: lm-eval transitively pulls in torch (~2 GB) plus datasets. TUI/ask/
# ingest users never need it. Run with:
#   uv sync --extra evals
#   uv run claritymed eval medqa --provider <id> --limit 50
evals = [
    "lm-eval>=0.4.5,<0.5",
    "datasets>=2.20",
]
# Local OCR for scanned / messy PDFs — second leg of the chain after
# pymupdf. marker-pdf is best-in-class but pulls PyTorch (~2 GB), so it is
# behind an optional extra. License: GPL-3.0-or-later (acknowledged at
# plan time alongside the pymupdf AGPL question).
ocr-scanned = [
    "marker-pdf>=0.2",
]
# Office formats (.docx / .pptx / .xlsx) — last leg of the document chain.
# Pure-Python wrapper around the pandoc binary; ``pypandoc-binary`` ships
# the binary alongside the wheel for installs that don't have pandoc on
# PATH. Optional because most users never need it.
ocr-office = [
    "pypandoc-binary>=1.13",
]
# Local raster-image OCR — image_chain fallback when the vision LLM
# (omlx) is unreachable. RapidOCR is a PaddleOCR ONNX port: ~50 MB of
# models, runs on the onnxruntime we already pull for the PHI scrubber.
# Chinese-medical-document quality is verified in tests/e2e/ocr/.
# Optional because the fallback path is rare and the models are
# non-trivial on disk.
ocr-image = [
    "rapidocr-onnxruntime>=1.4",
]

[project.scripts]
claritymed = "claritymed.cli.main:main"
# Long-running RAG servers — installed but only usable after
# `uv sync --extra rag-server` (FlagEmbedding + fastapi + uvicorn).
# Without the extra, invoking either prints a clear remediation hint
# and exits non-zero (see servers/embedder.py top-of-file try/except).
claritymed-embedder = "claritymed.servers.embedder:main"
claritymed-reranker = "claritymed.servers.reranker:main"
# Symptoms server + training entry — only usable after
# `uv sync --extra symptoms-server` (fastapi + uvicorn + httpx).
# Training reuses torch already in the main deps.
claritymed-symptoms-server = "claritymed.servers.symptoms.app:main"
claritymed-symptoms-train-ddxplus = "claritymed.ingest.symptoms.ddxplus.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claritymed"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    # OCR e2e fixture generation: minimal real-format files generated
    # in-process so tests/e2e/ocr/ doesn't have to ship binary fixtures.
    "reportlab>=4.0",   # PDF
    "python-docx>=1.0", # DOCX
    "openpyxl>=3.1",    # XLSX
    "python-pptx>=0.6", # PPTX
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "textual-dev>=1.8.0",
    "diff-cover>=9.2",
]

[tool.pytest.ini_options]
# --ignore=tests/e2e keeps e2e out of normal CI runs (they need live services).
# Run e2e explicitly: uv run pytest tests/e2e -v --no-cov
addopts = "--cov=src/claritymed --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --ignore=tests/e2e"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "local: tests that require live local services; excluded from CI",
    "mineru_office: MineRU Office formats (docx/xlsx/pptx) — cloud queue is systemically slow (>5min); skipped by default, run with `-m mineru_office`",
]

[tool.coverage.run]
source = ["src/claritymed"]
