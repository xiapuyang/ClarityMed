# Inherits the default gitleaks ruleset and adds a single allowlist:
# uv.lock is autogenerated by `uv` and contains only PyPI URLs + SHA256
# wheel hashes. Gitleaks misidentifies some of those 64-char hex hashes as
# Square access tokens. Lock files have no secrets to leak — they are
# checksums against public PyPI artifacts — so we exclude the file wholesale.

[extend]
useDefault = true

[allowlist]
description = "Allowlist autogenerated lock files"
paths = [
    '''(^|/)uv\.lock$''',
]
