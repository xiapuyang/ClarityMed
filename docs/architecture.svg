  <text x="600" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">🚩 Red-Flag Safety Gate</text>
  <text x="600" y="273" text-anchor="middle" font-size="10.5" fill="#7a7a7a">deterministic rules — emergency triage</text>

  <rect x="920" y="228" width="200" height="58" rx="7" fill="#fbfbfb" stroke="#9a9a9a" stroke-dasharray="6 4"/>
  <text x="1020" y="254" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">⛔ Emergency</text>
  <text x="1020" y="273" text-anchor="middle" font-size="10.5" fill="#8a8a8a">seek immediate care</text>

  <!-- PRE-PROCESSING -->
  <rect x="120" y="360" width="190" height="66" rx="7" fill="#ffffff" stroke="#5a5a5a"/>
  <text x="215" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">🔍 OCR Module</text>
  <text x="215" y="409" text-anchor="middle" font-size="10.5" fill="#8a8a8a">doc → structured text</text>

  <rect x="360" y="355" width="480" height="74" rx="7" fill="#ececec" stroke="#333" stroke-width="2"/>
  <text x="600" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">🔐 PHI Guard + Deterministic Router</text>
  <text x="600" y="406" text-anchor="middle" font-size="10.5" fill="#7a7a7a">local / cloud decision · picks modules</text>

  <!-- LLM AGENT + TOOLS -->
  <rect x="100" y="595" width="180" height="78" rx="7" fill="#ffffff" stroke="#5a5a5a"/>
  <text x="190" y="640" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">📚 RAG</text>

  <rect x="100" y="700" width="180" height="54" rx="7" fill="#fbfbfb" stroke="#9a9a9a" stroke-dasharray="6 4"/>
  <text x="190" y="732" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">🗄️ RAG Datasets</text>

  <rect x="300" y="595" width="180" height="78" rx="7" fill="#ffffff" stroke="#5a5a5a"/>
  <text x="390" y="640" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">🩺 Symptom Detection</text>

  <rect x="300" y="700" width="180" height="54" rx="7" fill="#fbfbfb" stroke="#9a9a9a" stroke-dasharray="6 4"/>
  <text x="390" y="732" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">🗄️ DDxPlus</text>

  <rect x="500" y="590" width="220" height="120" rx="9" fill="#e6e6e6" stroke="#1f1f1f" stroke-width="2.6"/>
  <text x="610" y="628" text-anchor="middle" font-size="17" font-weight="bold" fill="#161616">🧠 LLM Agent</text>
  <text x="610" y="652" text-anchor="middle" font-size="10.5" fill="#666">Orchestrator · context assembler</text>
  <text x="610" y="670" text-anchor="middle" font-size="10.5" fill="#666">uncertainty fusion</text>
  <text x="610" y="688" text-anchor="middle" font-size="10.5" fill="#666">grounded answer</text>

  <rect x="780" y="595" width="180" height="78" rx="7" fill="#ffffff" stroke="#5a5a5a"/>
  <text x="870" y="640" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">👁️ Vision Detection</text>

  <rect x="1000" y="558" width="190" height="56" rx="7" fill="#ffffff" stroke="#5a5a5a"/>
  <text x="1095" y="582" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">💬 ask_user_question</text>
  <text x="1095" y="600" text-anchor="middle" font-size="10" fill="#8a8a8a">follow-up · clarify · history</text>

  <rect x="1000" y="706" width="190" height="56" rx="7" fill="#ffffff" stroke="#5a5a5a"/>
  <text x="1095" y="730" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">📝 update_user_info</text>
  <text x="1095" y="748" text-anchor="middle" font-size="10" fill="#8a8a8a">profile · allergy · history</text>

  <!-- SAFETY & OUTPUT -->
  <rect x="430" y="885" width="260" height="66" rx="7" fill="#ffffff" stroke="#5a5a5a"/>
  <text x="560" y="915" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">🛡️ Safety &amp; Compose</text>
  <text x="560" y="934" text-anchor="middle" font-size="10.5" fill="#8a8a8a">disclaimers · audit log</text>

  <rect x="718" y="885" width="240" height="66" rx="7" fill="#ececec" stroke="#333" stroke-width="2"/>
  <text x="838" y="915" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">📦 Output</text>
  <text x="838" y="934" text-anchor="middle" font-size="10.5" fill="#7a7a7a">answer · citations · confidence · flags</text>

  <!-- ============ LEGEND ============ -->
  <rect x="100" y="1010" width="1185" height="110" rx="8" fill="none" stroke="#cfcfcf"/>
  <text x="690" y="1035" text-anchor="middle" font-size="11" letter-spacing="2" fill="#9a9a9a">LEGEND</text>

  <g font-size="11.5" fill="#555">
    <path d="M150,1075 L210,1075" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="222" y="1079">main data flow</text>

    <path d="M360,1075 L420,1075" fill="none" stroke="#555" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    <text x="432" y="1079">input-specific route</text>

    <path d="M590,1075 L650,1075" fill="none" stroke="#555" stroke-width="1.8" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
    <text x="662" y="1079">bidirectional (call / return)</text>

    <path d="M905,1075 L965,1075" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrowBig)"/>
    <text x="977" y="1079">emergency exit</text>

    <rect x="1120" y="1063" width="44" height="24" rx="5" fill="#fbfbfb" stroke="#9a9a9a" stroke-dasharray="6 4"/>
    <text x="1176" y="1079">external dataset</text>
  </g>
</svg>
