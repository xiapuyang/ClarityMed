repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: trailing-whitespace
      - id: check-added-large-files
        # 2048 KB headroom: uv.lock alone is ~1.1 MB and grows with
        # every dep change, so a 1024 KB cap blocks routine commits
        # without catching the binary blobs this hook is meant to stop.
        args: [--maxkb=2048]
      - id: end-of-file-fixer
      - id: check-ast
      - id: debug-statements
      - id: check-json
      - id: check-yaml
        # ``--unsafe`` accepts (without constructing) custom YAML tags
        # so lm-eval-harness task YAMLs like ``cmb_exam.yaml`` — which
        # use ``!function utils_cmb_exam.process_docs`` — still parse
        # for syntax checking without the hook trying to resolve them.
        args: [--unsafe]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-bypass-patterns
        name: Block AI bypass patterns
        language: pygrep
        entry: '(?i)(simplified version|quick version|TODO:\s*integrate|skip validation)'
        types: [python]

      - id: no-wip-commit
        name: Block WIP commits
        language: pygrep
        entry: '^(wip|WIP)\b'
        stages: [commit-msg]

      - id: commit-msg-length
        name: Subject line ≤ 72 chars
        language: system
        entry: >-
          bash -c
          'line=$(head -1 "$1");
          len=${#line};
          if [ -z "${line// }" ]; then echo "❌ Empty commit message"; exit 1; fi;
          if [ "$len" -gt 72 ]; then echo "❌ Subject too long ($len chars, max 72)"; exit 1; fi' --
        stages: [commit-msg]

      # Run unit tests when framework files change — catches regressions
      # before they land in a commit. Only fires when orchestrator / core /
      # stores / cli files are staged, so pure-doc or config changes stay fast.
      - id: pytest-framework
        name: Unit tests (framework change)
        language: system
        entry: uv run pytest --ignore=tests/e2e -q --no-cov --tb=short
        pass_filenames: false
        files: '^src/claritymed/(orchestrator|core|stores|cli)/'
        stages: [pre-commit]

      # Full unit tests on every push — last line of defence before the
      # branch is shared. Install with:
      #   uv run pre-commit install --hook-type pre-push
      - id: pytest-pre-push
        name: Full unit tests
        language: system
        entry: uv run pytest --ignore=tests/e2e -q --no-cov --tb=short
        pass_filenames: false
        stages: [pre-push]

      # E2E tests on push — skips gracefully when local services aren't
      # running (embedder / reranker / LLM). Same install as above.
      - id: pytest-e2e-pre-push
        name: E2E tests
        language: system
        entry: uv run pytest tests/e2e -q --no-cov --tb=short
        pass_filenames: false
        stages: [pre-push]
