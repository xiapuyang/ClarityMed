# OCR service configuration.
#
# Two configuration styles supported (use one, not both):
#
# 1) Chain mode (new): document_chain / image_chain are ordered lists.
#    The first provider that returns text wins; OcrError falls through.
#    phi_policy="local-only" filters cloud providers (is_local=False) out
#    of the chain at composition time — defense-in-depth alongside the
#    per-provider env gate (CLARITYMED_ALLOW_MINERU).
#
# 2) Legacy single-provider (kept for back-compat): document_provider +
#    image.default/fallback. Same behavior as before Unit 3.
#
# Provider names:
#   pymupdf — local digital-PDF text extraction (no model load).
#   marker  — local scanned-PDF OCR (PyTorch; install via
#             `uv sync --extra ocr-scanned`).
#   pandoc  — local office formats → markdown (install via
#             `uv sync --extra ocr-office`).
#   llm     — pydantic-ai vision LLM (locality = chain entry's `is_local`
#             or provider_id catalog kind).
#   mineru  — MineRU cloud SaaS. Requires both MINERU_API_TOKEN env var
#             AND CLARITYMED_ALLOW_MINERU=1. is_local=False → structurally
#             filtered from PHI chains regardless of env.

# Legacy single-provider settings (used when *_chain sections are empty).
document_provider: mineru

image:
  default: llm
  fallback: mineru

# Chain mode (uncomment to enable):
# phi_policy: local-only
# document_chain:
#   - { name: pymupdf, is_local: true }
#   - { name: marker, is_local: true, optional_extra: ocr-scanned }
#   - { name: llm, is_local: true, provider_id: vision-local }
#   - { name: pandoc, is_local: true, optional_extra: ocr-office }
# image_chain:
#   - { name: llm, is_local: true, provider_id: vision-local }
#   - { name: marker, is_local: true, optional_extra: ocr-scanned }

# MineRU API settings (only used when mineru is in a chain or as a
# single-provider value). Requires CLARITYMED_ALLOW_MINERU=1 at runtime.
mineru:
  api_key_env: MINERU_API_TOKEN
  model_version: vlm     # pipeline | vlm
  poll_interval: 3.0     # seconds between status polls
  poll_timeout: 300.0    # max seconds to wait before giving up

# LLM-based OCR settings — two ways to specify the model:
#
# Option A: reference an existing models.yaml provider by id (recommended).
#   provider_id: <id>
#
# Option B: inline connection details.
#   model: "<prefix>:<model>"   # e.g. "openai:gpt-4o"  (no base_url)
#   model: "bare-name"          # e.g. "qwen-vl:7b"     (with base_url)
#   base_url: "http://..."
#   api_key_env: ENV_VAR_NAME   # only honored when base_url is set
llm:
  provider_id: omlx
