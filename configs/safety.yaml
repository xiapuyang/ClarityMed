# PHI guard rules + red-flag wiring. Red-flag user-facing text is in
# configs/i18n/{en,zh}.yaml under the redflag.* namespace; this file holds
# detection metadata only.
phi:
  fields:
    - patient.allergies.*.substance
    - patient.conditions.*.code
    - patient.medications.*.dose
    - lab_panel.values.*.value
    - lab_panel.source_doc
  providers:
    local: allow
    cloud: deny
  on_deny: redact
  # Free-text PII scrubbing rules. Applied at two enforcement points:
  #   1. stores/user_rag.py.add_document  — before chunks are persisted
  #   2. orchestrator/services/*          — before any LLM prompt is assembled
  # Both points scrub regardless of provider kind (local OR cloud), because
  # user privacy is not solely a cloud-egress concern.
  free_text_patterns:
    - name: phone_cn
      regex: '(?<!\d)1[3-9]\d{9}(?!\d)'
      replacement: '[REDACTED:PHONE]'
    - name: phone_intl
      regex: '\+\d{1,3}[\s-]?\d{3,4}[\s-]?\d{3,4}[\s-]?\d{0,4}'
      replacement: '[REDACTED:PHONE]'
    - name: phone_us
      regex: '\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b'
      replacement: '[REDACTED:PHONE]'
    - name: email
      regex: '[\w.+-]+@[\w-]+\.[\w.-]+'
      replacement: '[REDACTED:EMAIL]'
    - name: id_cn
      regex: '(?<!\d)\d{17}[\dXx](?!\d)'
      replacement: '[REDACTED:ID]'
    - name: mrn
      regex: '\bMRN[:\s-]*\d{6,}\b'
      replacement: '[REDACTED:MRN]'
  # OpenAI Privacy Filter — bidirectional token classifier for unstructured
  # PII the regex layer misses: names, addresses, dates, secrets, URLs.
  # On by default; transformers + onnxruntime are base dependencies.
  privacy_filter:
    enabled: true
    device: cpu   # auto: mps → cuda → cpu; override with "cpu"/"cuda"/"mps"
    model_name: openai/privacy-filter
    # ONNX quantized variant (~809 MB). Set to null to use PyTorch safetensors (~2.8 GB).
    onnx_file: onnx/model_q4f16.onnx
    # Tokens the NER reliably misreads but that carry no PHI value.
    #
    # IN-SCOPE: clinical lexicon (drug names, devices, procedures, anatomy)
    # the NER misclassifies as person / secret. Always safe to add —
    # these terms are never PHI on their own.
    #
    # OUT OF SCOPE: anything that looks like a name (张三/李四/李医生),
    # a place (北京/上海), an organization, or a date. These shapes can be
    # PHI in real chat — provider name and city of residence are both HIPAA
    # identifiers. Do not add them just because a test fixture uses them as
    # a placeholder; rename the fixture to an obviously synthetic form
    # (Patient_001, City_A) instead.
    #
    # Matching is case-insensitive substring, gated by two safety rules
    # implemented in core/scrub/service.py:
    #   1. only applies to private_person / secret / account_number spans
    #   2. after stripping every matched term from the span, the residual
    #      must be ≤ 3 non-whitespace chars — otherwise the span is kept
    #      so real PHI co-flagged with a clinical word ("李医生开的青霉素")
    #      still gets redacted.
    whitelist:
      # Chinese drug names misread as private_person.
      - 青霉素
      - 阿莫西林
      - 头孢
      - 头孢曲松
      - 头孢克肟
      - 二甲双胍
      - 阿司匹林
      - 布洛芬
      - 对乙酰氨基酚
      - 氯雷他定
      - 西替利嗪
      - 奥美拉唑
      - 雷尼替丁
      - 胰岛素
      - 利妥昔单抗
      - 甲氨蝶呤

red_flags: []

disclaimer:
  always_attach_default: true
  emergency_overrides: true
