# PHI guard rules + red-flag wiring. Red-flag user-facing text is in
# configs/i18n/{en,zh}.yaml under the redflag.* namespace; this file holds
# detection metadata only.
phi:
  fields:
    - patient.allergies.*.substance
    - patient.conditions.*.code
    - patient.medications.*.dose
    - lab_panel.values.*.value
    - lab_panel.source_doc
  providers:
    local: allow
    cloud: deny
  on_deny: redact
  # Free-text PII scrubbing rules. Applied at two enforcement points:
  #   1. stores/user_rag.py.add_document  — before chunks are persisted
  #   2. orchestrator/services/*          — before any LLM prompt is assembled
  # Both points scrub regardless of provider kind (local OR cloud), because
  # user privacy is not solely a cloud-egress concern.
  free_text_patterns:
    - name: phone_cn
      regex: '(?<!\d)1[3-9]\d{9}(?!\d)'
      replacement: '[REDACTED:PHONE]'
    - name: phone_intl
      regex: '\+\d{1,3}[\s-]?\d{3,4}[\s-]?\d{3,4}[\s-]?\d{0,4}'
      replacement: '[REDACTED:PHONE]'
    - name: email
      regex: '[\w.+-]+@[\w-]+\.[\w.-]+'
      replacement: '[REDACTED:EMAIL]'
    - name: id_cn
      regex: '(?<!\d)\d{17}[\dXx](?!\d)'
      replacement: '[REDACTED:ID]'
    - name: mrn
      regex: '\bMRN[:\s-]*\d{6,}\b'
      replacement: '[REDACTED:MRN]'
  # OpenAI Privacy Filter — bidirectional token classifier for unstructured
  # PII the regex layer misses: names, addresses, dates, secrets, URLs.
  # Off by default (requires transformers+torch; install with
  # ``uv sync --extra privacy-filter``).
  privacy_filter:
    enabled: true
    device: cpu   # auto: mps → cuda → cpu; override with "cpu"/"cuda"/"mps"
    model_name: openai/privacy-filter
    # ONNX quantized variant (~809 MB). Set to null to use PyTorch safetensors (~2.8 GB).
    onnx_file: onnx/model_q4f16.onnx

red_flags: []

disclaimer:
  always_attach_default: true
  emergency_overrides: true
