# Provider catalog. Each entry is a tiny declaration:
#
#   id:          our catalog key (stored in Account.provider_id, audit logs).
#   kind:        local | cloud — PHI guard reads this. PHI may only leave
#                the box when kind == local.
#   model:       Two shapes:
#                  - no base_url → pydantic-ai "<prefix>:<model>" form
#                    (e.g. "openai:gpt-4o"). The prefix selects wire format
#                    and which env var holds the API key.
#                  - with base_url → bare model name (e.g. "qwen3:14b",
#                    "mlx-community/Llama-3.2-3B"). Forwarded as-is to the
#                    server.
#   base_url:    optional — set when the endpoint is self-hosted (Ollama,
#                MLX, llama.cpp, LM Studio) or a corporate mirror.
#   api_key_env: optional — env var name for the API key. Only honored
#                when base_url is set; raises MissingApiKeyError if
#                declared but unset. Stock cloud entries ignore this and
#                use pydantic-ai's own env-var conventions.
#   thinking:    optional reasoning toggle. One of:
#                  - omitted  → use the vendor's default behavior
#                  - true     → enable with the vendor's default effort
#                  - false    → explicitly disable (useful for always-on
#                               models like Gemini 2.5 where you want it off)
#                  - "minimal" | "low" | "medium" | "high" | "xhigh"
#                               → enable at a specific effort level
#                Forwarded to pydantic-ai's unified ModelSettings.thinking,
#                which maps to anthropic_thinking / openai_reasoning_effort /
#                google_thinking_config under the hood. Silently ignored on
#                models that don't support reasoning.
#
# Adding a cloud entry only declares the option exists. A user still has
# to opt in (Account.cloud_provider_opt_in) and the admin must populate
# the env var before any request actually goes out.

providers:
  # ---- Local: OpenAI-compatible servers ----
  - id: ollama
    kind: local
    model: "qwen3:14b"
    base_url: "http://127.0.0.1:11434/v1"

  - id: mlx
    kind: local
    model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
    base_url: "http://127.0.0.1:8080/v1"

  # Example: remote local model behind auth (uncomment + set env var to use).
  # - id: ollama-remote
  #   kind: local
  #   model: "qwen3:14b"
  #   base_url: "https://ollama.example.internal/v1"
  #   api_key_env: OLLAMA_REMOTE_KEY

  # ---- Cloud: OpenAI-compatible vendors ----
  # Env vars (read by pydantic-ai's stock providers, no code in this repo
  # touches them): OPENAI_API_KEY, DEEPSEEK_API_KEY, GEMINI_API_KEY,
  # ALIBABA_API_KEY (or DASHSCOPE_API_KEY), MOONSHOTAI_API_KEY,
  # OPENROUTER_API_KEY, ANTHROPIC_API_KEY.
  - id: openai
    kind: cloud
    model: "openai:gpt-4o"
  - id: deepseek
    kind: cloud
    model: "deepseek:deepseek-chat"
  - id: gemini
    kind: cloud
    model: "google-gla:gemini-2.0-flash"
  - id: qwen
    kind: cloud
    model: "alibaba:qwen-max"
  - id: kimi
    kind: cloud
    model: "moonshotai:kimi-k2-0711-preview"
  - id: openrouter
    kind: cloud
    model: "openrouter:anthropic/claude-sonnet-4.5"

  # ---- Cloud: native Anthropic Messages API ----
  - id: claude
    kind: cloud
    model: "anthropic:claude-sonnet-4-5"

  # Example: same Claude model with extended thinking turned on. The
  # orchestrator may still override per-request when a specific question
  # needs more or less reasoning.
  # - id: claude-thinking
  #   kind: cloud
  #   model: "anthropic:claude-sonnet-4-5"
  #   thinking: high

default_provider: ollama
