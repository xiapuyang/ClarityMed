# Interaction mode registry — single source of truth for what each
# mode does, which tools it may call, whether it may invoke LLM inference,
# and how router classifies inputs into modes.
#
# Decided in docs/brainstorms/2026-06-07-001-interaction-modes-requirements.md
# Planned in docs/plans/2026-06-07-001-feat-modes-and-tui-plan.md
#
# Keys must match Literal["ingest","ask","rag"] in core/schemas/.

modes:
  ingest:
    prompt_key: ingest
    audit_event_type: mode.ingest
    # LLM softening (M7 revised): default off. When true, ingest_agent may call
    # the LLM for field identification only (e.g. "this line is Hb"). The
    # prompt itself forbids numerical interpretation / reference range generation.
    allow_llm_inference: false
    tools:
      - extract_lab_fields_stub
      - normalize_to_loinc_stub
      - save_to_profile
      - save_to_lab_record
      - save_to_vision_record

  ask:
    prompt_key: ask
    audit_event_type: mode.ask
    allow_llm_inference: true
    tools:
      - retrieve_medical_literature
      - load_patient_facts
      - load_lab_timeline
      - cite_source

  rag:
    prompt_key: rag
    audit_event_type: mode.rag
    # Default off. When true, rag_agent may call LLM for chunk metadata tagging
    # (auto labels, doc type detection) only. Prompt forbids free-form generation.
    allow_llm_inference: false
    tools:
      - embed_and_store
      - tag_phi
      - fetch_web_link_stub

router:
  # Confidence thresholds (router.py uses >= and < for boundaries):
  #   conf >= high_threshold -> execute directly
  #   low_threshold <= conf < high_threshold -> LLM fallback
  #   conf < low_threshold -> ambiguous (caller surfaces ModeModal / prompt)
  high_threshold: 0.9
  low_threshold: 0.5

  rules:
    # Explicit prefixes — highest confidence (1.0).
    explicit_prefixes:
      - prefix: "/mode "       # /mode ask, /mode ingest, /mode rag
        target: derive          # parse remainder
      - prefix: "/upload"
        target: ingest
      - prefix: "/library"
        target: rag
      - prefix: "/ask"
        target: ask

    # Imperative verbs that indicate the user wants to record something.
    imperative_verbs_ingest:
      - 上传
      - 录入
      - 存档
      - 记录
      - upload
      - add to my records
      - save this report
      - record this

    # Imperative verbs that indicate the user wants to manage reference material.
    imperative_verbs_rag:
      - 参考资料
      - 资料库
      - 收藏
      - library
      - reference
      - add to my library
      - save this paper

    # Question patterns -> ask mode.
    question_patterns:
      - "\\?$"
      - "？$"
      - "^(what|how|why|when|where|is|are|can|should|could|do|does|will|would)"
      - "^(是什么|怎么|为什么|什么时候|哪里|是否|能否|可以|会不会)"

  llm_fallback:
    # Which provider to use for the small router LLM. Should be a fast local
    # provider; ollama with qwen3-4b is a good default. The provider must
    # already exist in configs/models.yaml.
    provider_id: ollama
