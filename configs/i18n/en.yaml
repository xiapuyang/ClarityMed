disclaimer:
  default: "This information is for general guidance only and not a substitute for professional medical advice."
  emergency: "If this is a medical emergency, call your local emergency number now."
  privacy_phi: "Personal health information stays on your device. Cloud models are disabled unless you opt in."

redflag:
  chest_pain_with_dyspnea: "Chest pain with shortness of breath can be a medical emergency. Please call 911 / your local emergency line immediately."
  anaphylaxis_signs: "Trouble breathing, facial swelling, or fainting after exposure may be anaphylaxis. Call emergency services now."

ui:
  cli:
    greeting: "ClarityMed CLI — patient-facing medical Q&A."
    user_required: "No --user provided. Falling back to 'default'. Use 'claritymed init-user <id>' to create a new profile."
  api:
    health: "OK"

term:
  loinc:
    glucose: "Blood glucose"
    creatinine: "Creatinine"
    hba1c: "Hemoglobin A1c"

modes:
  ingest:
    label: "My Records"
    description: "Save personal info, history, or report attachments."
    empty_prompt: "Use /upload <path> to add a record, or type a fact like 'allergy: penicillin'."
  ask:
    label: "Ask"
    description: "Ask a medical question and get an answer with citations."
    empty_prompt: "What would you like to know?"
  rag:
    label: "My Library"
    description: "Manage reference materials (uploaded docs, system collections)."
    empty_prompt: "Use /library to manage references, or /upload to add a new one."

rag:
  collection:
    # Display labels shown to users in the Sources section. Keys mirror
    # collection ids in `configs/retrieval.yaml:system_rag.collections[].name`
    # plus the synthetic `user_rag` key (one shared label across every
    # per-user collection like `user_rag_alice`).
    #
    # StatPearls / MedRAG are brand names — same in en and zh — but we
    # still maintain them here so adding a new collection only touches
    # i18n yaml, never Python code.
    # Keys must match FROZEN Qdrant collection names — change display values only.
    statpearls_en: "MedRAG-StatPearls"
    textbooks_en: "MedRAG-Textbooks"
    user_rag: "My Library"

ask_modal:
  answer_header: "↳ Your answer"
  answer_question: "  • {question}"
  answer_value: "    ▶ {value}"
  declined_header: "User declined to answer questions"
  declined_question: "  └ · {question}（{options}）"
  multi_empty: "—"
  hint_single: "↑↓ move · enter submit · esc cancel"
  hint_multi: "↑↓ move · space toggle · enter submit · esc cancel"
  badge_single: "Single"
  badge_multi: "Multi"

phi:
  redaction_marker:
    name: "[REDACTED:NAME]"
    phone: "[REDACTED:PHONE]"
    email: "[REDACTED:EMAIL]"
    id: "[REDACTED:ID]"
    mrn: "[REDACTED:MRN]"
    address: "[REDACTED:ADDR]"

# Typed-exception display strings. The error class itself names *what* went
# wrong; these strings answer *what should the user do about it* in their
# language. Keep messages short and free of internal jargon.
errors:
  revision_conflict: "This record was changed by another process. Reload and try again."
  unknown_sha256: "That file is not attached to this session. Re-upload or pick from the library."
  phi_leak_detected: "PHI defense engaged: this cloud call was refused to keep personal health information on your machine."
  ocr_failed: "Could not extract text from the attachment. You can save the record without OCR or retry from the library view."
  record_not_found: "No record at that path. It may have been deleted from another session."
  path_outside_user_domain: "That path is outside your data directory. The action was refused."

tool:
  approval:
    update_profile_field: "Update profile: {field} → {value}"
    save_allergy: "Save allergy: {substance} ({severity})"
    save_condition: "Save condition: {display}"
    save_medication: "Save medication: {name}"
    save_record: "Save {kind}: {title}"
    save_to_library: "Save to library: {title}"
    delete_record: "Delete record: {record_path}"
