  declined_question_numeric: "  └ · {question}（{range}）"
  multi_empty: "—"
  hint_single: "↑↓ move · enter submit · esc cancel"
  hint_multi: "↑↓ move · space toggle · enter submit · esc cancel"
  hint_numeric: "Type a number, press enter · esc cancel"
  badge_single: "Single"
  badge_multi: "Multi"
  badge_numeric: "Number"
