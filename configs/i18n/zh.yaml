    notes: "用户 '{user_id}'"
  list_status: "{system_count} 系统 + 1 用户 · 检索：{state}"
  retrieval_ready: "就绪"
  retrieval_disabled: "已禁用 (rag.enabled=false)"
  disabled_banner: "RAG 已禁用（configs/retrieval.yaml: rag.enabled=false）——无法搜索。"
  search_status: "从 [{collections}] 中获取 {count} 个分片\n扩展查询：{expanded}\n{timings}"
  timings: "embed {embed_ms}ms · search {search_ms}ms · rerank {rerank_ms}ms · parent {parent_ms}ms"
