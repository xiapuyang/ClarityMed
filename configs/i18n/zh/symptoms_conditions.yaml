# 症状卡片渲染器使用的病种精编内容（中文）。
#
# Key 必须与 wire.DifferentialRow.condition_id 一一对应——
# 即 core/symptoms/datasets/canonical.py:slugify_condition 生成的
# 标准 slug，来源见 demo/ddxplus_demo/ddxplus/release_conditions.json。
# 缺失任一 key（en 或 zh 均会检查）会在 plugin 构建时抛
# SymptomsCatalogValidationError；未覆盖病种的卡片不会渲染，
# 因此本文件不允许部分覆盖。
#
# 内容规范：
#   report        —— 2-5 句，面向患者、通俗语言。说明疾病是什么 +
#                     常见首发症状。**不写**治疗方案；**不写**用药剂量。
#   suggestion    —— 1-3 句可执行的下一步建议。分级要与紧急程度匹配：
#                     急症类以急救指令开头，门诊类给出时间窗。渲染时
#                     只用于卡片下方的汇总"下一步建议"，不再逐卡展示。
conditions:
  spontaneous_pneumothorax:
    display_name: "自发性气胸"
    report: |
      自发性气胸是指没有明显外伤的情况下，气体进入肺与胸壁之间的
      空隙，导致肺组织塌陷。典型表现为突发的一侧尖锐胸痛和呼吸
      困难，常在剧烈咳嗽或用力后出现。高瘦体型的年轻人和吸烟者
      风险更高。
    suggestion: |
      当日前往急诊。胸片可以确诊；小的气胸有时可以观察，
      较大的气胸可能需要胸腔穿刺放气或胸腔闭式引流。

  cluster_headache:
    display_name: "丛集性头痛"
    report: |
      丛集性头痛是最剧烈的原发性头痛之一。发作严格集中在一侧，
      多位于眼周或眼后，每次持续 15 分钟到 3 小时，常伴随同侧
      流泪、鼻塞或眼睑下垂。发作往往在一段时间里每天发生，之后
      进入缓解期。
    suggestion: |
      建议几天内就诊内科或神经内科。急性发作常用高流量吸氧或
      注射型曲坦类药物，发作期需要预防性用药。

  boerhaave:
    display_name: "自发性食管破裂（Boerhaave 综合征）"
    report: |
      Boerhaave 综合征是剧烈呕吐引起的食管全层自发性破裂。
      典型表现为剧烈呕吐后突发的胸部或上腹部剧痛，常伴呼吸
      困难，病情可迅速恶化。若未在数小时内处理，死亡率极高，
      属外科急症。
    suggestion: |
      立即拨打急救电话。**不要**进食进饮，也**不要**等待疼痛
      自行缓解——诊断通常靠 CT，处理需外科或内镜下修补。

  spontaneous_rib_fracture:
    display_name: "自发性肋骨骨折"
    report: |
      自发性肋骨骨折是指没有明显外伤的情况下发生的肋骨骨折，
      常见于剧烈咳嗽后，或骨质疏松、肿瘤等骨质薄弱人群。表现
      为局限、明确的胸壁疼痛，深呼吸、咳嗽或扭动时加重。
    suggestion: |
      建议几天内就诊，行胸部影像检查并处理疼痛。若出现呼吸困难、
      发热或疼痛持续加剧，应尽快复诊——可能提示肺穿孔或肺炎。

  gerd:
    display_name: "胃食管反流病（GERD）"
    report: |
      GERD 是胃酸反流至食管所致的慢性疾病，表现为胸骨后烧灼感
      （烧心）、反酸，有时伴口中酸味、慢性咳嗽或声音嘶哑。
      症状常在饭后或平躺时加重。
    suggestion: |
      先尝试生活方式调整——少食多餐、避免睡前进食、抬高床头。
      若几周后仍有症状，或出现吞咽困难、体重减轻、呕血、
      黑便，应及时就诊。

  hiv_initial_infection:
    display_name: "HIV 初次（急性）感染"
    report: |
      HIV 急性感染指暴露后最初 2-4 周的阶段。许多人出现类流感
      症状——发热、咽痛、肌肉酸痛、淋巴结肿大，有时伴皮疹，
      可自行缓解。识别这一阶段很重要，因为此时病毒载量极高、
      早期治疗获益明显。
    suggestion: |
      尽快就诊做 HIV 检测，并告知医生近期可能的暴露史，
      以便选择能检出早期感染的检测项目（RNA 或抗原抗体联合）。
      早期启动抗病毒治疗对长期预后有显著益处。

  anemia:
    display_name: "贫血"
    report: |
      贫血是指红细胞或血红蛋白低于正常，从而降低血液携氧能力。
      常见表现为乏力、无力、面色苍白、活动后气短，有时伴心悸
      或头晕。缺铁是最常见的原因。
    suggestion: |
      建议两周内就诊内科，查血常规并明确病因。若出现胸痛、
      严重气短或晕厥，应尽快就医。

  viral_pharyngitis:
    display_name: "病毒性咽炎（嗓子疼）"
    report: |
      病毒性咽炎是病毒感染引起的咽部炎症，表现为咽痛、咽干、
      咽痒，常伴流涕、咳嗽、低热和声音嘶哑。多数在一周内
      自行缓解。
    suggestion: |
      多休息、多饮水，可以用温盐水漱口或含服润喉片缓解不适。
      如果咽痛持续超过一周、无法吞咽液体，或出现无咳嗽的
      高热，请及时就诊。

  inguinal_hernia:
    display_name: "腹股沟疝"
    report: |
      腹股沟疝是腹腔内容物（多为脂肪或肠管）经腹壁薄弱处
      向腹股沟区突出所形成的包块。常表现为咳嗽或用力时出现
      的柔软肿块，伴局部不适或下坠感。
    suggestion: |
      建议几周内就诊普外科评估。若肿块变得疼痛、触痛明显、
      质地变硬且无法回纳，请**立即**前往急诊——可能是嵌顿疝。

  myasthenia_gravis:
    display_name: "重症肌无力"
    report: |
      重症肌无力是一种累及神经-肌肉接头的自身免疫病，肌力在
      活动后减弱、休息后恢复。早期常见症状包括眼睑下垂、
      复视、吞咽困难、说话含糊。严重发作可累及呼吸肌。
    suggestion: |
      建议几天内就诊神经内科完成抗体检测、肌电图等。
      一旦出现呼吸困难或吞咽自己的口水都困难，应**立即**
      前往急诊——肌无力危象危及生命。

  whooping_cough:
    display_name: "百日咳"
    report: |
      百日咳是一种传染性极强的细菌性呼吸道感染。起病像感冒，
      随后进展为剧烈的阵咳，吸气时可发出高调的"鸡鸣样"回响。
      咳嗽可持续数周，婴儿病情最重。
    suggestion: |
      建议 1-2 天内就诊——抗生素早用效果最好，也能降低传染性。
      6 个月以下婴儿，或出现呼吸困难、口唇发紫者，应立即急诊。

  anaphylaxis:
    display_name: "过敏性休克（全身过敏反应）"
    report: |
      过敏性休克是暴露于过敏原后数分钟至数小时内出现的全身
      严重过敏反应。表现包括荨麻疹或潮红、口唇或咽喉肿胀、
      喘息或呼吸困难、血压骤降伴头晕或晕厥、呕吐、腹绞痛。
    suggestion: |
      **立即**拨打急救电话。如果身边有肾上腺素自动注射笔，
      应立即在大腿外侧注射——**不要**等待症状自行缓解。
      注射后仍需前往急诊，因为症状可能反复。

  epiglottitis:
    display_name: "急性会厌炎"
    report: |
      急性会厌炎是喉入口处会厌软骨的迅速肿胀。典型表现为
      剧烈咽痛、流涎、声音低沉含糊、吞咽困难、呼吸困难，
      可迅速进展至气道阻塞。无论儿童还是成人都是急症。
    suggestion: |
      **立即**拨打急救电话前往急诊。在家**不要**用压舌板等
      检查咽喉——刺激气道可能诱发完全阻塞。

  guillain_barr_syndrome:
    display_name: "格林-巴利综合征"
    report: |
      格林-巴利综合征是一种罕见的自身免疫性周围神经病，
      常在感染后数天至数周发生。典型表现为双下肢开始的
      对称性无力和麻木感，逐渐向上蔓延，严重时可累及
      呼吸肌。
    suggestion: |
      **尽快**前往急诊——早期住院很重要，因为无力可能进展
      迅速，静脉丙种球蛋白（IVIG）或血浆置换在早期效果最好。

  acute_laryngitis:
    display_name: "急性喉炎"
    report: |
      急性喉炎是短期的喉部炎症，多为病毒感染或用嗓过度所致。
      常见表现为声音嘶哑或失音、咽喉粗糙或刺激感、干咳，
      有时伴低热，一般 1-2 周内可自行缓解。
    suggestion: |
      让声带休息、多饮水、避免烟雾。若嘶哑持续超过 2 周、
      出现呼吸困难或咳血，请就诊评估。

  croup:
    display_name: "急性喉气管支气管炎（哮吼）"
    report: |
      哮吼是幼儿常见的病毒性上气道感染，特征是喉部及气管
      粘膜肿胀。典型表现为"犬吠样"咳嗽、声音嘶哑，吸气
      时可出现粗厉的喉鸣，夜间加重。
    suggestion: |
      安抚孩子情绪，尝试呼吸潮湿或凉爽的空气。24 小时内
      就诊儿科评估。若安静状态下仍有喉鸣、流涎、或用力
      呼吸，应立即急诊。

  psvt:
    display_name: "阵发性室上性心动过速（PSVT）"
    report: |
      PSVT 是起源于心房或房室结的突发规律性心动过速，
      心率通常在 150-250 次/分。发作起止突然，可持续数分钟
      至数小时。常见表现为心悸、胸中扑动感、头晕，有时
      短暂气短。
    suggestion: |
      发作时可尝试迷走神经刺激动作（如屏气用力、冷水拍脸），
      发作后就诊心内科评估。若发作 15 分钟以上不缓解，
      或伴胸痛、严重气短、晕厥，请立即急诊。

  atrial_fibrillation:
    display_name: "心房颤动（房颤）"
    report: |
      房颤是一种不规律且常伴快心率的心律失常，会显著增加
      脑卒中和心力衰竭风险。常见表现为心悸、胸部扑动感、
      气短、疲乏，也有部分患者无自觉症状。
    suggestion: |
      建议几天内就诊心内科，做心电图并评估卒中风险——
      多数患者需要控制心率或转复心律，并使用抗凝药。
      若出现胸痛、晕厥或严重气短，应立即急诊。

  bronchiectasis:
    display_name: "支气管扩张症"
    report: |
      支气管扩张是气道结构永久性扩大和瘢痕化的慢性疾病，
      常由反复感染所致。典型表现为长期每日咳嗽伴大量咳痰、
      反复呼吸道感染，有时伴气短。
    suggestion: |
      建议几周内就诊呼吸内科，行胸部 CT 明确诊断。若出现
      发热、咳嗽加重或咳血，请尽快复诊。

  allergic_sinusitis:
    display_name: "过敏性鼻窦炎"
    report: |
      过敏性鼻窦炎是过敏反应引起的鼻窦粘膜炎症，常见诱因
      为花粉、尘螨或宠物皮屑。表现为鼻塞、清水样鼻涕、
      喷嚏、眼痒、面部胀感，有时伴轻度头痛。症状多呈
      季节性或与特定接触相关。
    suggestion: |
      可尝试生理盐水冲鼻、鼻用糖皮质激素喷雾、无嗜睡型
      抗组胺药。若几周后仍持续影响睡眠或日常活动，
      建议就诊耳鼻喉科或过敏专科。

  chagas:
    display_name: "美洲锥虫病（Chagas 病）"
    report: |
      Chagas 病由克鲁斯锥虫引起，通过锥蝽（"接吻虫"）叮咬
      传播，主要流行于拉丁美洲。急性感染多轻微或无症状，
      部分人出现发热、乏力和叮咬处或眼周肿胀。慢性期
      （数十年后）可累及心脏或消化道。
    suggestion: |
      在流行地区生活或长期旅行者，建议就诊感染科筛查。
      抗寄生虫治疗越早启动效果越好。

  scombroid_food_poisoning:
    display_name: "组胺鱼类中毒（Scombroid 中毒）"
    report: |
      Scombroid 中毒是食用未妥善冷藏的鱼类（多为金枪鱼、
      鲭鱼、鬼头刀）后类似组胺反应。症状常在数分钟至
      2 小时内出现——面部潮红、口中辣椒样烧灼感、头痛、
      心悸、腹泻，多数在数小时内自行缓解。
    suggestion: |
      可服用非处方抗组胺药并多饮水。若出现喘息、咽喉肿胀、
      胸痛，或症状持续数小时不缓解，请前往急诊。

  myocarditis:
    display_name: "心肌炎"
    report: |
      心肌炎是心肌的炎症，多在病毒感染后发生。常见表现
      包括胸痛、气短、心悸、乏力、下肢水肿——常在类流感
      症状数天至数周后出现。严重程度从轻微到危及生命的
      心力衰竭不等。
    suggestion: |
      若出现胸痛、严重气短或晕厥，立即前往急诊。否则
      建议几天内就诊心内科，完善心电图、心肌酶、心脏
      超声等检查。

  larygospasm:
    display_name: "喉痉挛"
    report: |
      喉痉挛是声带突然不自主地闭合，导致气道短暂堵塞。
      典型表现为突然无法吸气或发声，有时伴高调喉鸣音，
      通常在数秒至一分钟内自行缓解。常见触发因素包括
      反流、过敏、气道刺激。
    suggestion: |
      发作时保持镇静，用鼻缓慢吸气。建议几天内就诊，
      排查诱因（如胃食管反流）。若单次发作持续超过约
      一分钟或伴意识丧失，请前往急诊。

  acute_dystonic_reactions:
    display_name: "急性肌张力障碍反应"
    report: |
      急性肌张力障碍反应是使用某些药物（多为抗精神病药
      或止吐药）后突发的不自主肌肉收缩，最常累及颈部、
      舌、下颌或眼球。虽然极不舒适且令人恐惧，但极少
      危及生命。
    suggestion: |
      当日前往急诊。通常一次抗胆碱药或抗组胺药肌注即可
      缓解。将诱发反应的药物名字告知所有后续医生。

  localized_edema:
    display_name: "局限性水肿 / 血管性水肿"
    report: |
      局限性水肿是身体某部位的肿胀，常见于面部、口唇、
      舌、手或某肢体。病因包括过敏反应（血管性水肿）、
      局部感染、外伤或静脉/淋巴回流受阻。累及口腔或
      咽喉的血管性水肿可影响气道。
    suggestion: |
      怀疑过敏性肿胀可先口服非处方抗组胺药，并在一天内
      就诊。若肿胀累及舌、咽喉或口唇并出现呼吸或吞咽
      困难，**立即**拨打急救电话。

  sle:
    display_name: "系统性红斑狼疮（SLE）"
    report: |
      SLE 是一种自身免疫性疾病，免疫系统会攻击多个器官
      系统。症状差异极大，常见表现包括乏力、关节疼痛、
      蝶形面部红斑、口腔溃疡、脱发、光敏感。急性发作
      也可累及肾、心脏和神经系统。
    suggestion: |
      建议几周内就诊内科或风湿免疫科完成血液学检查。
      若出现胸痛、剧烈头痛、皮疹迅速加重或深色尿，
      请尽快复诊。

  tuberculosis:
    display_name: "肺结核"
    report: |
      结核病是由结核分枝杆菌引起的慢性传染病，最常累及肺部。
      活动性肺结核典型表现为持续 3 周以上的咳嗽，可伴痰中
      带血、盗汗、体重下降、低热。
    suggestion: |
      建议几天内就诊完善检查（结核菌素试验或干扰素释放
      试验 + 胸片）。结核具有传染性但可治愈——切勿
      拖延评估。

  unstable_angina:
    display_name: "不稳定型心绞痛"
    report: |
      不稳定型心绞痛是冠脉供血减少引起的胸痛，特点是
      新发、发作更频繁、更剧烈或在静息时出现——这是
      心肌梗死即将发生的预警信号。疼痛常为压榨样，可
      放射至手臂、下颌或背部，伴出汗、恶心、气短。
    suggestion: |
      **立即**拨打急救电话。**不要**自己开车前往，
      **不要**等待疼痛自行缓解。若未曾对阿司匹林过敏
      且医生告知过可用，可嚼服一片阿司匹林（325 mg）。

  stable_angina:
    display_name: "稳定型心绞痛"
    report: |
      稳定型心绞痛是由可预测的诱因（如活动、寒冷、情绪
      应激）触发的胸部不适，休息数分钟或含服硝酸甘油
      后缓解。它反映冠脉的固定狭窄，对个人来说有可识别
      的固定模式。
    suggestion: |
      建议几天内就诊内科或心内科评估并给予二级预防治疗。
      若发作模式**改变**——静息时发作、持续时间变长、
      出现新症状，应立即急诊——可能已转为不稳定型
      心绞痛。

  ebola:
    display_name: "埃博拉病毒病"
    report: |
      埃博拉是通过接触感染者或动物的体液传播的严重病毒
      感染。潜伏期 2-21 天，起病表现为发热、乏力、
      肌肉痛、头痛，随后出现呕吐、腹泻，甚至内出血或
      外出血。
    suggestion: |
      前往医院前**先电话联系**当地公共卫生部门或急诊
      科，以便安排隔离。就诊时明确告知医生近期到过
      疫区或接触过埃博拉患者。

  acute_otitis_media:
    display_name: "急性中耳炎"
    report: |
      急性中耳炎是中耳腔的感染，儿童多见，常在感冒后
      出现。表现为耳痛、发热，幼儿可表现为烦躁不安，
      还可能出现听力改变或耳道流液。多数较大儿童和
      成人可不使用抗生素自行缓解。
    suggestion: |
      可用非处方止痛药缓解症状，1-2 天内就诊耳鼻喉科
      或儿科评估。若疼痛剧烈、高热、耳后肿胀，或
      发生在 6 个月以下婴儿，应尽快就诊。

  panic_attack:
    display_name: "惊恐发作"
    report: |
      惊恐发作是一次骤然出现的强烈恐惧或不适感，通常
      在约十分钟内达到高峰。症状包括心跳加速、胸闷、
      气短、出汗、颤抖、头晕，以及对失控或死亡的
      恐惧。发作令人恐惧但并不危险，症状可与更严重
      的疾病相似。
    suggestion: |
      发作时尝试慢节奏呼吸（吸气 4 拍、呼气 6 拍），
      提醒自己不适感会过去。如果反复发作，建议几周内
      就诊精神心理科——惊恐障碍对认知行为治疗和药物
      反应良好。

  bronchospasm_acute_asthma_exacerbation:
    display_name: "支气管痉挛 / 急性哮喘发作"
    report: |
      哮喘急性发作是气道狭窄加重，表现为气短、喘息、
      胸闷和咳嗽。常见诱因包括呼吸道感染、过敏原、
      冷空气、运动和烟雾。严重发作可能进展为呼吸衰竭。
    suggestion: |
      按医嘱使用速效缓解型吸入剂（如沙丁胺醇），
      通常在储雾罐辅助下每 20 分钟 4-8 喷、可持续
      一小时。若一小时内无改善、说话只能吐几个字，
      或口唇/指端发紫，应**立即**拨打急救电话。

  bronchitis:
    display_name: "急性支气管炎"
    report: |
      急性支气管炎是大气道的炎症，多在病毒性上呼吸道
      感染后出现。咳嗽是主要症状，可有清亮或颜色改变
      的痰，伴喘息、低热、轻度咽痛。咳嗽在其他症状
      消退后仍可持续数周。
    suggestion: |
      多休息、多饮水，使用非处方对症药物。若咳嗽持续
      超过 3 周、咳血、出现高热或气短，请就诊评估。

  acute_copd_exacerbation_infection:
    display_name: "慢阻肺急性加重（伴感染）"
    report: |
      慢阻肺急性加重是指症状在日常波动之外持续加重。
      经典三联征为呼吸困难加重、痰量或痰色改变、咳嗽
      加剧，最常见的诱因是感染和空气污染。
    suggestion: |
      按医嘱使用支气管扩张吸入剂，并启用曾开过的"应急
      备药包"。当天就诊内科或呼吸科；若气促严重、口唇
      或指端发紫、或出现意识模糊、嗜睡，应**立即**急诊。

  pulmonary_embolism:
    display_name: "肺栓塞"
    report: |
      肺栓塞是血栓（多来自下肢深静脉）阻塞肺动脉分支
      所致。典型表现为突发气短、深呼吸时加重的尖锐胸痛、
      咳嗽（有时痰中带血）、心动过速、头晕或晕厥。
      未治疗的肺栓塞可迅速致命。
    suggestion: |
      **立即**拨打急救电话。诊断多依赖 CT 肺动脉造影，
      治疗以抗凝为主，严重病例需溶栓治疗。

  urti:
    display_name: "上呼吸道感染（普通感冒）"
    report: |
      上呼吸道感染是累及鼻、咽、鼻窦的病毒性疾病。
      典型表现为鼻塞、流涕、喷嚏、咽痛、轻咳、低热。
      症状常在 2-3 天达到高峰，一周内缓解。
    suggestion: |
      多休息、多饮水，可使用非处方对症药物。若症状
      超过 10 天、初步好转后反弹，或出现高热、耳痛、
      气短，请就诊。

  influenza:
    display_name: "流感"
    report: |
      流感是一种病毒性呼吸道疾病，起病急骤，伴发热、
      畏寒、肌痛、头痛、乏力、咽痛和咳嗽。症状比
      普通感冒更重，一般持续约一周。并发症包括肺炎，
      老年人和慢性病患者风险最高。
    suggestion: |
      多休息、多饮水、对症治疗。若属高危人群（老人、
      幼儿、孕妇、慢性病）应在 48 小时内就诊——
      抗病毒药早期使用效果最好。

  pneumonia:
    display_name: "肺炎"
    report: |
      肺炎是肺组织感染，可由细菌、病毒或真菌引起。
      典型表现为咳嗽（常伴咳痰）、发热、寒战、气短，
      呼吸时胸痛也常见。老年人有时表现为神志不清或
      乏力，而不一定有典型发热。
    suggestion: |
      当日就诊评估。医生通常会安排胸部影像检查；
      若考虑细菌性病因，会启用抗生素。

  acute_rhinosinusitis:
    display_name: "急性鼻窦炎"
    report: |
      急性鼻窦炎是持续时间不足 4 周的鼻腔和鼻窦炎症，
      多为病毒性，常在感冒后发生。表现为面部胀痛、
      鼻塞、鼻涕（可为浓稠或颜色改变）、嗅觉减退，
      有时伴咳嗽或头痛。
    suggestion: |
      前 7-10 天可尝试鼻腔盐水冲洗、减充血剂、
      对症止痛。若症状超过 10 天、初步好转后反弹、
      或出现高热、剧烈面部疼痛、眼周肿胀，请就诊。

  chronic_rhinosinusitis:
    display_name: "慢性鼻窦炎"
    report: |
      慢性鼻窦炎是持续 12 周以上、且规范治疗后仍存在
      的鼻窦炎症。表现为持续鼻塞、面部胀感、浓稠鼻涕、
      嗅觉减退，常伴后鼻滴涕感和疲乏。
    suggestion: |
      建议几周内就诊耳鼻喉科评估——治疗常包括鼻用
      糖皮质激素、盐水冲洗，必要时行影像或内镜检查
      查找结构性病因。

  bronchiolitis:
    display_name: "毛细支气管炎"
    report: |
      毛细支气管炎是婴幼儿常见的病毒性下呼吸道感染，
      多由 RSV 引起。起病像感冒，1-2 天内进展为呼吸
      加快、喘息、进食困难。多数患儿可在家 1-2 周
      内恢复。
    suggestion: |
      保证水分摄入，用生理盐水滴鼻和轻柔吸痰缓解
      鼻塞，密切观察呼吸。若出现呼吸急促费力、
      脱水、呼吸暂停、或口唇/面部发紫，应立即急诊。

  pulmonary_neoplasm:
    display_name: "肺部肿物（肺肿瘤）"
    report: |
      肺部肿物是肺内新生物，可为良性或恶性。早期常无
      症状；出现症状时可表现为持续咳嗽、咳血、胸痛、
      不明原因体重下降、反复肺部感染。吸烟和长期
      吸入某些有害物质是主要危险因素。
    suggestion: |
      建议几天内就诊内科评估并完善胸部影像检查。若出现
      咳血、剧烈胸痛或静息气短，请尽快复诊。

  possible_nstemi_stemi:
    display_name: "疑似心肌梗死（NSTEMI / STEMI）"
    report: |
      NSTEMI 和 STEMI 都属心肌梗死——冠状动脉血流阻断
      导致部分心肌缺血坏死。典型表现为压榨样或沉重感
      的胸痛，可放射至手臂、下颌或背部，伴出汗、气短、
      恶心、头晕。女性、老年人及糖尿病患者症状可能不
      典型。
    suggestion: |
      **立即**拨打急救电话，**不要**自行前往医院。
      若未曾对阿司匹林过敏且医生曾告知可用，可嚼服
      一片阿司匹林（325 mg）。

  sarcoidosis:
    display_name: "结节病"
    report: |
      结节病是一种炎症性疾病，免疫细胞在多种器官内
      形成"肉芽肿"，最常累及肺和淋巴结。症状可从
      完全无症状到持续咳嗽、气短、胸部不适、乏力、
      皮疹、眼红或眼痛。
    suggestion: |
      建议几周内就诊呼吸内科完善胸部影像和血液学
      检查，可能需要转诊风湿免疫科——治疗方案取决于
      具体累及的器官。

  pancreatic_neoplasm:
    display_name: "胰腺肿物"
    report: |
      胰腺肿物是胰腺的新生物。早期常无症状；出现症状时
      可表现为上腹或中背部疼痛、不明原因体重下降、食欲
      减退、新发糖尿病、皮肤或眼白发黄（黄疸）、大便
      发白。
    suggestion: |
      建议几天内就诊完善血液学检查和腹部影像。若出现
      剧烈腹痛、持续呕吐或新发黄疸，请立即急诊。

  acute_pulmonary_edema:
    display_name: "急性肺水肿"
    report: |
      急性肺水肿是液体快速积聚在肺内，最常由急性心力
      衰竭引起。典型表现为严重气短、必须坐起来才能
      呼吸、湿性咳嗽（有时咳粉红色泡沫痰）、出汗、
      窒息或溺水样感觉。
    suggestion: |
      **立即**拨打急救电话。等待期间保持坐位、双腿
      下垂，有助于减轻呼吸负担。这是医疗急症，
      需要吸氧、利尿并治疗原发病。

  pericarditis:
    display_name: "心包炎"
    report: |
      心包炎是心包（包裹心脏的膜性结构）的炎症。典型
      表现为尖锐性胸痛，平躺时加重、坐起并前倾时
      减轻，可放射至肩部，常伴发热和近期病毒感染史。
    suggestion: |
      当日前往急诊——需要心电图、血液学检查和心脏
      超声。多数患者对抗炎药反应良好，但少数会出现
      需要密切监护的并发症。
