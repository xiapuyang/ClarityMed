# 视觉检测功能的用户可见文案。
#
# 由 core/i18n/loader.py 加载（configs/i18n/<lang>/*.yaml 会合并到
# 该语言的扁平字典）。Vision 有意把疾病显示名、标签翻译、确认弹窗、
# 审计用的 specialist_keywords 放在 `configs/i18n/` 而不是 prompt-
# registry —— 后者的「版本不可变 + 启动校验」对译者要常改的 UI 文案
# 来说太重；prompt-registry 留给 LLM system prompt。
#
# 由 vision_plugin（Unit 7）通过 t() / t_list() 读取。en/zh 必须同步，
# 缺键时 fallback 到裸 key 字符串（界面上一眼可见地坏掉）。
vision:
  # 喂给 LLM tool description 的「这种场景用这个 disease_id」一行说明。
  intent:
    breast_cancer_ultrasound: |
      当用户上传一张乳腺超声图像，并询问可疑病灶是否需要担心、是良性
      还是恶性时，使用这个工具。以下情况**不要**调用：图像不是超声；
      图像已经带有放射科医生的报告（ocr_has_report=true）；图像本身
      不是医学影像。
    lung_cancer_chest_ct: |
      当用户上传一张胸部 CT 图像（轴位切片），并询问肺结节或肿块是否
      需要担心、可能是哪种类型的肺癌、是否看起来正常时，使用这个工具。
      以下情况**不要**调用：图像不是 CT；图像已经带有放射科医生的
      报告（ocr_has_report=true）；图像本身不是医学影像。
    skin_cancer_dermoscopy: |
      当用户上传一张皮肤镜（或近距离皮肤照片）图像，并询问痣、皮肤
      斑块、皮损是否需要担心、可能是哪种类型的皮肤癌（黑色素瘤、
      基底细胞癌、鳞状细胞癌、光化性角化）、还是良性（普通痣、
      皮肤纤维瘤、脂溢性角化、色素性良性角化、血管病变）时，使用
      这个工具。以下情况**不要**调用：图像不是皮肤镜或近距离皮肤
      照片；图像已经带有皮肤科医生的报告（ocr_has_report=true）；
      图像本身不是医学影像。
    lung_cancer_histopathology: |
      当用户上传一张肺组织病理（显微镜下染色组织切片）图像 ——
      通常来自肺活检 —— 并询问该组织是否显示腺癌、鳞状细胞癌，
      或看起来是正常肺组织时，使用这个工具。以下情况**不要**
      调用：图像不是肺组织病理切片（例如是结肠活检、胸部 CT 或
      非医学图像）；图像已经带有病理科医生的报告
      （ocr_has_report=true）；图像本身不是医学影像。
    colon_cancer_histopathology: |
      当用户上传一张结肠组织病理（显微镜下染色组织切片）图像 ——
      通常来自结肠活检 —— 并询问该组织是否显示腺癌，或看起来是
      正常结肠组织时，使用这个工具。以下情况**不要**调用：图像
      不是结肠组织病理切片（例如是肺活检、肠镜下照片或非医学
      图像）；图像已经带有病理科医生的报告（ocr_has_report=true）；
      图像本身不是医学影像。

  # 各疾病的显示名 —— 出现在确认弹窗与 LLM 回复正文中。
  # 疾病身份是二维的（病种 × 成像方式）。同一病种在不同成像方式下
  # （例如「肺癌 + 胸部 CT」与「肺癌 + 组织病理」）使用不同的
  # disease_id 和不同的显示名，确认弹窗才能让用户清楚知道即将运行
  # 的是哪个模型。同一 disease_id（即同一 (病种 × 成像方式)）内的
  # 多模型 fallback 由 configs/vision.yaml 中该 disease 的 `flow:`
  # 数组表达，不在这里新增 disease 条目。
  disease:
    breast_cancer_ultrasound:
      name: "乳腺癌（超声）"
    lung_cancer_chest_ct:
      name: "肺癌（胸部 CT）"
    skin_cancer_dermoscopy:
      name: "皮肤癌（皮肤镜）"
    lung_cancer_histopathology:
      name: "肺癌（病理切片）"
    colon_cancer_histopathology:
      name: "结肠癌（病理切片）"

  # 各标签的本地化名称 + 简短描述。当用户追问「X 是什么意思」时，LLM
  # 可以引用 description。
  label:
    breast_cancer_ultrasound:
      benign:
        name: "良性"
        description: "非癌性病灶。通常按常规随访处理。"
      malignant:
        name: "恶性"
        description: "可疑癌性病变。建议尽快请乳腺专科医生复核图像。"
      normal:
        name: "正常"
        description: "未发现病灶。仅从这张图像看，无需采取行动。"
    lung_cancer_chest_ct:
      adenocarcinoma:
        name: "腺癌"
        description: "肺腺癌。建议尽快请专科医生复核。"
      large_cell_carcinoma:
        name: "大细胞癌"
        description: "肺大细胞癌。建议尽快请专科医生复核。"
      squamous_cell_carcinoma:
        name: "鳞状细胞癌"
        description: "肺鳞状细胞癌。建议尽快请专科医生复核。"
      normal:
        name: "正常"
        description: "未发现肺癌相关征象。仅从这张图像看，无需采取行动。"
    skin_cancer_dermoscopy:
      actinic_keratosis:
        name: "光化性角化"
        description: "日光损伤导致的癌前病变。建议请皮肤科医生评估进展风险。"
      basal_cell_carcinoma:
        name: "基底细胞癌"
        description: "最常见的皮肤癌。建议请皮肤科医生复核。"
      dermatofibroma:
        name: "皮肤纤维瘤"
        description: "良性纤维结节。通常按常规随访处理。"
      melanoma:
        name: "黑色素瘤"
        description: "可疑黑色素瘤——最严重的皮肤癌。建议尽快请皮肤科医生复核。"
      nevus:
        name: "普通痣"
        description: "常见痣（良性）。可自我观察，常规复诊。"
      pigmented_benign_keratosis:
        name: "色素性良性角化"
        description: "良性色素性角化。通常按常规随访处理。"
      seborrheic_keratosis:
        name: "脂溢性角化"
        description: "良性脂溢性角化。通常按常规随访处理。"
      squamous_cell_carcinoma:
        name: "鳞状细胞癌"
        description: "皮肤鳞状细胞癌。建议请皮肤科医生复核。"
      vascular_lesion:
        name: "血管病变"
        description: "良性血管病变（如樱桃状血管瘤）。通常按常规随访处理。"
    lung_cancer_histopathology:
      adenocarcinoma:
        name: "腺癌"
        description: "组织病理下的肺腺癌。建议请专科医生复核。"
      normal:
        name: "正常"
        description: "组织病理下的正常肺组织。未发现恶性特征。"
      squamous_cell_carcinoma:
        name: "鳞状细胞癌"
        description: "组织病理下的肺鳞状细胞癌。建议请专科医生复核。"
    colon_cancer_histopathology:
      adenocarcinoma:
        name: "腺癌"
        description: "组织病理下的结肠腺癌。建议请专科医生复核。"
      normal:
        name: "正常"
        description: "组织病理下的正常结肠组织。未发现恶性特征。"

  # 工具体在发任何 HTTP 请求之前弹出的确认框。
  confirm:
    breast_cancer_ultrasound:
      title: "分析这张乳腺超声？"
      body: |
        我可以用一个小型乳腺超声模型对这张图像做估计，看病灶更像
        良性、恶性还是正常。结果只是估计——临床医生的判读才是最终
        依据。要运行模型吗？
      yes_label: "好，运行"
      yes_description: "把图像送到本地的乳腺超声模型。"
      no_label: "不用了"
      no_description: "跳过模型，只基于文字回答。"
    lung_cancer_chest_ct:
      title: "分析这张胸部 CT？"
      body: |
        我可以用一个小型胸部 CT 模型对这张图像做估计，看肺部结节
        更像腺癌、大细胞癌、鳞状细胞癌还是正常组织。结果只是估计——
        放射科医生的判读才是最终依据。要运行模型吗？
      yes_label: "好，运行"
      yes_description: "把图像送到本地的胸部 CT 模型。"
      no_label: "不用了"
      no_description: "跳过模型，只基于文字回答。"
    skin_cancer_dermoscopy:
      title: "分析这张皮肤镜图像？"
      body: |
        我可以用一个小型皮肤镜模型对这张图像做估计，看皮损更像
        恶性（黑色素瘤、基底细胞癌、鳞状细胞癌、光化性角化）还是
        良性（普通痣、皮肤纤维瘤、脂溢性角化、色素性良性角化、
        血管病变）。结果只是估计——皮肤科医生的判读才是最终依据。
        要运行模型吗？
      yes_label: "好，运行"
      yes_description: "把图像送到本地的皮肤镜模型。"
      no_label: "不用了"
      no_description: "跳过模型，只基于文字回答。"
    lung_cancer_histopathology:
      title: "分析这张肺组织病理切片？"
      body: |
        我可以用一个小型病理模型对这张显微镜图像做估计，看肺
        组织更像腺癌、鳞状细胞癌，还是正常的肺组织。结果只是
        估计——病理科医生的判读才是最终依据。要运行模型吗？
      yes_label: "好，运行"
      yes_description: "把图像送到本地的肺组织病理模型。"
      no_label: "不用了"
      no_description: "跳过模型，只基于文字回答。"
    colon_cancer_histopathology:
      title: "分析这张结肠组织病理切片？"
      body: |
        我可以用一个小型病理模型对这张显微镜图像做估计，看结肠
        组织更像腺癌还是正常的结肠组织。结果只是估计——病理科
        医生的判读才是最终依据。要运行模型吗？
      yes_label: "好，运行"
      yes_description: "把图像送到本地的结肠组织病理模型。"
      no_label: "不用了"
      no_description: "跳过模型，只基于文字回答。"

  # 审计 allow-list（KTD-V1，与 symptoms.safety_keywords 平行）。
  # 当 clinical_action 落在 _AUDIT_ACTIONS 中时，post_process 会扫描
  # LLM 的回复看是否包含下列任一短语；缺失会触发
  # `vision.specialist_keywords.missing`。这不是模板原文，LLM 的措辞
  # 由 vision_final_reply.yaml 决定。
  specialist_keywords:
    urgent_specialist:
      - "尽快就诊"
      - "乳腺专科"
      - "肿瘤科"
      - "皮肤科"
      - "尽快预约"
      - "建议尽快"
    soon_specialist:
      - "建议复诊"
      - "近期就诊"
      - "随访"
      - "请咨询医生"

  # 当 LLM 无法仅凭附件 tag 判断 disease_id 或 modality 时，需要触发
  # askuserquestion 弹窗（来源 §9 [B]）。选项由 plugin 在运行时填充，
  # 此处只是文案。
  disambig:
    disease:
      title: "需要我帮你检查哪种情况？"
      body: |
        我可以对这张图像跑视觉模型，但还不确定你希望检查哪种疾病。
        请从下列选项中选择：
    modality:
      title: "这是什么类型的影像？"
      body: |
        我对这张影像的具体类型不太确定。明确成像方式后，我才能挑对
        模型。这是超声、CT、X 光，还是其他类型？
