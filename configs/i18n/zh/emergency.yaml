# 急诊分诊门控 i18n（中文）。
#
# 第 1 阶段只包含两个 footer 键：当生效灵敏度为 `off`（用户禁用了
# 安全网）或 `strict`（高召回模式，可能会出现较多提示）时，在
# 每条回复末尾追加一段确定性提示。Phase 2 会补齐每条规则对应的
# `emergency.action.*` 文案与 `emergency.missing_qualifier.*` 提示。
#
# 措辞约束：
#   - `gate_disabled` 是不可绕过的安全声明，需要简洁明确，提醒用户
#     这条回复没有经过急救分诊筛查。
#   - `strict_mode_active` 解释为什么提示可能"过敏感"，避免用户
#     把误报误读为系统出错。

emergency:
  footer:
    gate_disabled: |
      ---

      *提示：您当前已关闭急救分诊筛查，本条回复没有经过紧急症状的安全检查。如怀疑紧急情况，请立即拨打当地急救电话（中国：120；美国：911；英国：999）。*
    strict_mode_active: |
      ---

      *当前处于"高灵敏度"模式，我可能会把一些较轻的症状也提示出来，这是设计如此。如果觉得提示过于频繁，可在设置里调低灵敏度。*
  action:
    # ACS — 急性冠脉综合征。中文场景以 120 为主入口。
    call_ems_cardiac: |
      **请立即拨打 120 急救电话——这可能是心肌梗死。**不要自行驾车；如不过敏且手边有阿司匹林，可咀嚼一片；保持坐位或卧位，等待救护人员到达。
    # 卒中 FAST 阳性。"时间就是大脑"——黄金溶栓时间窗 4.5 小时。
    call_ems_stroke: |
      **请立即拨打 120 急救电话——这些表现提示可能是脑卒中。**请记下症状开始的准确时间（治疗窗口对此至关重要）。不要进食或饮水。不要自行驾车。
    # 严重过敏反应。WAO 2020 → 先肾上腺素再 EMS。
    epi_then_ems: |
      **如果您有肾上腺素自动注射笔（EpiPen 等），请立即使用，然后拨打 120。**平躺并抬高双腿。如果 5–15 分钟症状仍未缓解，可使用第二剂。即便症状好转，仍需前往急诊——双相反应可能数小时后再次发作。
    # 蛛网膜下腔出血 — "霹雳样头痛"，Ottawa SAH 规则。
    call_ems_sah: |
      **请立即拨打 120 急救电话——突发的剧烈头痛可能是蛛网膜下腔出血（脑出血的一种）。**不要等待症状自行缓解。这种情况下及时影像学检查至关重要。
    # 自杀危机干预。覆盖中、美、英三地热线（与英文版对齐）。
    crisis_hotline_988: |
      **您并不孤单，现在就可以获得帮助。中国心理援助热线：400-161-9995；北京心理危机研究与干预中心：010-82951332；如在美国，可拨打或发短信至 988；英国可拨打 116 123（Samaritans）。**如果手边有可能造成伤害的物品，请远离它们，并请家人或朋友陪伴您直到联系到援助。
    # 模糊的胸痛 — ACEP 2018 → "数小时内需要评估"，但不一定立即叫 120。
    urgent_eval_chest_pain: |
      **胸痛需要今天就接受评估——请在数小时内前往急诊或急诊门诊就诊，即使疼痛已经缓解。**就诊前请记录：症状从什么时候开始、是什么感觉（压迫感、刺痛、烧灼感等）、什么情况下加重或缓解。
    # 肺栓塞 — Wells / ACEP 中高危分层。呼吸困难 + 单侧下肢肿胀 /
    # 胸膜炎样痛 / 咯血 / 晕厥 → 急需 CT 肺动脉造影。
    urgent_eval_pe: |
      **请立即拨打 120 急救电话——这可能是肺栓塞（肺动脉血栓）。**不要长距离行走或自行驾车。若单侧下肢肿胀，请勿按摩或搓揉。及时影像学检查至关重要。
    # 脓毒症（qSOFA 阳性）。Surviving Sepsis Campaign：识别 1 小时
    # 内启动抗生素 + 源头控制。
    urgent_eval_sepsis: |
      **请立即拨打 120 急救电话——这些表现合在一起可能是脓毒症，是机体对感染的危及生命的反应。**记录体温、症状起始时间、可能的感染源（泌尿系、肺、皮肤、近期手术）。识别后 1 小时内的抗生素可救命。
    # 细菌性脑膜炎经典三联征。IDSA 2004 → 临床怀疑即刻经验性抗生
    # 素 + 地塞米松。
    urgent_eval_meningitis: |
      **请立即拨打 120 急救电话——发热伴颈强直和意识改变可能是细菌性脑膜炎。**不要等待退烧。记下症状开始时间，首小时内的抗生素至关重要。若出现压之不褪色的皮疹，请在电话中告知。
    # 异位妊娠伴出血。ACOG Practice Bulletin 193 — 破裂是外科急
    # 症；未破裂也时间敏感（甲氨蝶呤 vs 手术）。
    urgent_eval_ectopic: |
      **请立即拨打 120 急救电话——早期妊娠出现腹痛伴出血可能是异位妊娠（宫外孕），破裂时会危及生命。**不要进食或饮水（可能需要手术）。带上末次月经日期与妊娠试验结果。
    # 睾丸扭转。AUA 急性阴囊指南 — 6 小时内外科复位才能保留睾丸。
    urgent_eval_torsion: |
      **立即前往最近的急诊——突发剧烈单侧睾丸疼痛可能是睾丸扭转，需在大约 6 小时内通过手术复位才能保住睾丸。**不要进食或饮水（可能需要手术）。如无法快速到达，请拨打 120 急救电话。
