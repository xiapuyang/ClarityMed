# 急诊分诊门控 i18n（中文）。
#
# 第 1 阶段只包含两个 footer 键：当生效灵敏度为 `off`（用户禁用了
# 安全网）或 `strict`（高召回模式，可能会出现较多提示）时，在
# 每条回复末尾追加一段确定性提示。Phase 2 会补齐每条规则对应的
# `emergency.action.*` 文案与 `emergency.missing_qualifier.*` 提示。
#
# 措辞约束：
#   - `gate_disabled` 是不可绕过的安全声明，需要简洁明确，提醒用户
#     这条回复没有经过急救分诊筛查。
#   - `strict_mode_active` 解释为什么提示可能"过敏感"，避免用户
#     把误报误读为系统出错。

emergency:
  footer:
    gate_disabled: |
      ---

      *提示：您当前已关闭急救分诊筛查，本条回复没有经过紧急症状的安全检查。如怀疑紧急情况，请立即拨打当地急救电话（中国：120；美国：911；英国：999）。*
    strict_mode_active: |
      ---

      *当前处于"高灵敏度"模式，我可能会把一些较轻的症状也提示出来，这是设计如此。如果觉得提示过于频繁，可在设置里调低灵敏度。*
