# Synthetic adversarial cases — the panic-attack-as-MI canary.
#
# Every case here mimics a critical presentation but the clinical
# ground truth is routine or urgent. The gate is graded by how often
# it (correctly) refuses to fire critical on this set; see
# evals/emergency/metrics.py::_adversarial_fpr for the precise
# metric (critical-only on adversarial cases).
#
# Authoring approach:
# Plan §"Eval Strategy" calls for LLM-generated + independent-LLM
# judge for ~80 synthetic cases. Stage 2 ships hand-authored cases
# patterned on real clinical mimics from DSM-5, AAFP, ICHD-3, ACEP
# pattern banks (panic attack, costochondritis, GERD, pericarditis,
# tension/migraine HA, hyperventilation, urticaria alone, vasovagal,
# conversion disorder, cervical strain, passive SI, heat exhaustion).
# These are pattern-by-pattern, not provider-generated, so they are
# deterministic and reviewable. The LLM-gen + judge pipeline is a
# Stage 3+ upgrade once the rule pack stabilizes.
#
# Distribution (60 cases):
#   chest-pain mimics (mostly testing ACS / chest_pain_ambiguous):
#     - panic attack       10  (5 en + 5 zh)
#     - costochondritis     5
#     - GERD / esoph spasm  5
#     - pericarditis        4
#   headache mimics (testing SAH):
#     - tension / cluster   8
#     - migraine w/ aura    5
#   anaphylaxis mimics:
#     - hyperventilation    3
#     - urticaria alone     3
#   neuro / stroke mimics:
#     - vasovagal syncope   4
#     - conversion disorder 3
#     - cervical strain     3
#   suicidal-ideation mimic:
#     - passive SI          4
#   sepsis / fever mimic:
#     - heat exhaustion     3

