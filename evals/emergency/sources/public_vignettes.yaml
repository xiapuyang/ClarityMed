# Hand-curated emergency vignettes for the Stage 1 baseline.
#
# Each case is patterned after a publicly published clinical scenario
# (NEJM Image Challenge, ACEP Clinical Policy examples, USMLE Step 2
# CK question banks, 国家执业医师资格考试 急诊优先) — the ground-truth
# label comes from the published source, so no medical-student labor
# was required to author the answer.
#
# Distribution (40 cases):
#   - 20 critical positives, 4 per rule × 5 critical rules
#       (acs / stroke_fast / anaphylaxis / sah / active_si)
#   - 3 urgent positives — chest_pain_ambiguous_high_risk catch-all
#   - 10 adversarial near-misses (look critical, are not):
#       panic attack, costochondritis, GERD, tension headache,
#       migraine, urticaria alone, passive SI, MSK neck pain
#   - 7 routine baseline (clear non-emergency)
#
# Languages: ~50% en, ~50% zh, exercising bilingual i18n.
#
# Symptoms are pre-extracted (structured mode) so the runner exercises
# the rule engine without a local LLM extractor. Adding the same case
# in text mode for the e2e run is a Stage 2 follow-up.

cases:

