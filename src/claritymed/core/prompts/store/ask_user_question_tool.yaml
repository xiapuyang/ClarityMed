              "questions": [
                {
                  "question": "你想让我打开哪份体检报告？",
                  "header": "选哪份报告？",
                  "options": [
                    {
                      "label": "2026-03-12 年度体检",
                      "description": "陈医生那次常规随访。"
                    },
                    {
                      "label": "2026-01-05 血脂检查",
                      "description": "12 月就诊后开的空腹抽血。"
                    },
                    {
                      "label": "2025-11-20 胸片",
                      "description": "针对持续咳嗽做的影像。"
                    }
                  ],
                  "multi_select": false
                }
              ]
            }

        硬性规则 —— validator 会拒绝违反以下任一条款的 payload：
          - 同一题内选项必须**互斥**（除非 multi_select=true）。重叠选项浪费用户时间。
          - **绝不**自己加 "其他/Other" 选项——UI 会自动提供自由文本兜底。
          - 单轮最多调用一次。调用了就**不要**同时再写一段长答复——等用户回答后再作答。

        反例选项组：["可能是糖尿病", "应该是糖尿病", "糖尿病相关"]  —— 三个意思一样，重叠。

        反例选项组：["查看我的推荐"]  —— 单个选项不是选择题。直接用文本反问。

        正例选项组：["1 型糖尿病", "2 型糖尿病", "妊娠糖尿病", "与糖尿病无关"]  —— 边界清晰。

        如果当前通道不可用（无 UI、非交互运行），工具会返回一段简短说明字符串。
        遇到这种返回**不要重试**——按你目前最合理的理解用普通文本作答即可。
