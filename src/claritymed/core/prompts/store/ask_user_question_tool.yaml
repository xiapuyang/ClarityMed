name: ask_user_question_tool
description: |
  Tool description shown to the LLM for the ``ask_user_question`` tool.
  Teaches when the tool is the right move (small enumerable answer
  space, missing critical input, ambiguous direction) and when plain
  text is better (open-ended questions, when the model can reasonably
  proceed). Bilingual; the active language is selected by the same
  ``language_ctx`` that drives the system prompt.
versions:
  - version: v1
    created_at: 2026-06-10
    notes: |
      Initial version. Mirrors the Claude Code AskUserQuestion intent:
      structured 2-4 option pickers used sparingly to resolve missing
      preferences, not as a substitute for reasoning. Forbids 'Other'
      options because the UI injects free-text automatically.
    languages:
      en: |
        Ask the user a structured multiple-choice question when you need
        information you cannot reasonably infer AND the answer space is
        small and enumerable (2-4 options per question, up to 4 questions
        per call).

        Use it for:
          - Gathering a missing preference or parameter when the choice
            materially changes your answer (target age group, target
            unit system, which of two interpretations).
          - Resolving ambiguity when the user's message has multiple
            plausible readings.
          - Confirming a risky or irreversible direction before
            committing.

        Do NOT use it:
          - When you can reasonably proceed and let the user redirect
            you. Default to acting, not asking.
          - For open-ended questions ('describe your symptoms', 'what
            brings you in'). Ask in plain text instead.
          - When options would exceed 4. Split into multiple questions
            or ask in plain text.
          - To re-confirm something the user already stated.

        Rules for the payload:
          - Each option must be mutually exclusive unless multi_select
            is true. Overlapping options waste the user's time.
          - Never include an 'Other' option yourself — the UI adds a
            free-text fallback automatically.
          - ``header`` is a chip label, 12 characters or fewer.
          - ``question`` must be self-contained; do not assume the user
            recalls prior turns.
          - At most one ``ask_user_question`` call per turn. If you call
            it, do not also write a long answer in the same turn — wait
            for the user's response and then answer.

        Bad option set: ['Maybe diabetes', 'Could be diabetes',
        'Diabetes-related']  — overlapping, all mean the same thing.

        Good option set: ['Type 1 diabetes', 'Type 2 diabetes',
        'Gestational diabetes', 'Not diabetes-related']  — clearly
        distinct.

        If the channel is unavailable (no UI, non-interactive run), the
        tool returns a short string saying so. When that happens, do
        not retry the tool — answer with your best understanding in
        plain text.
      zh: |
        当你需要用户提供信息、且这些信息**无法**从已知上下文推断、**并且**答案空间
        小到可以枚举时（每题 2-4 个选项，单次调用最多 4 个问题），使用这个工具向
        用户呈现一个结构化多选题。

        适用场景：
          - 收集会**实质改变答复**的缺失偏好或参数（目标年龄段、
            单位制、两种解读里选哪一种）。
          - 用户消息存在多种合理理解时进行澄清。
          - 在采取风险高或不可逆动作前确认方向。

        不适用场景：
          - 你完全可以基于现有信息合理推进、让用户事后纠偏时——优先**直接作答**，
            而不是反问。
          - 开放式问题（"描述一下你的症状"、"哪里不舒服"），用普通文本反问即可。
          - 选项超过 4 个——拆成多个问题，或者改用普通文本反问。
          - 用户已经说过的内容，**不要再问一遍**。

        Payload 规则：
          - 同一题内选项必须**互斥**（除非 multi_select=true）。重叠选项浪费用户时间。
          - **绝不**自己加 "其他/Other" 选项——UI 会自动提供自由文本兜底。
          - ``header`` 是 chip 标签，长度 ≤12 个字符。
          - ``question`` 必须自包含——不要假设用户还记得之前的轮次。
          - 单轮最多调用一次。调用了就**不要**同时再写一段长答复——等用户回答后再作答。

        反例选项组：["可能是糖尿病", "应该是糖尿病", "糖尿病相关"]  —— 三个意思一样，重叠。

        正例选项组：["1 型糖尿病", "2 型糖尿病", "妊娠糖尿病", "与糖尿病无关"]  —— 边界清晰。

        如果当前通道不可用（无 UI、非交互运行），工具会返回一段简短说明字符串。
        遇到这种返回**不要重试**——按你目前最合理的理解用普通文本作答即可。
