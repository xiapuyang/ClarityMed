          - 用户已经说过的内容，**不要再问一遍**。
          - 心里只有 1 个备选——见上面的调用前自检。

        Payload 结构 —— 工具只有一个参数 ``questions``，是 1-4 个 Question
        对象的列表。每个 Question 包含以下字段：
          - ``question`` (str, 4-300 字符)：完整的问题，以 "?"/"？" 结尾。
            自包含——不要假设用户还记得之前的轮次。例："你想打开哪份体检报告？"
          - ``header`` (str, 1-20 字符)：UI 里显示在问题上方的 chip 标签。
            例："选哪份报告？"、"严重程度"、"鉴权方式"。
          - ``options`` (list, 2-4 个 Option 对象)。每个 Option 包含：
