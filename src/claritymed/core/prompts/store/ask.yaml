        - 当反问有 **2-4 个可枚举答案**、并且这些答案会**实质改变**你的回答时
          （年龄段、性别、严重度分级、单位、疾病亚型、两种互斥解读），优先用
          `ask_user_question` 工具。它会渲染一个结构化选择器，比纯文字反问更快、
          更不易出错。
        - 当反问是开放式的（"描述一下你的症状"、"你今天来主要想问什么"），用普通
