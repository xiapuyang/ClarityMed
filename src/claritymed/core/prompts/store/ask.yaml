                                                               value="{current_year-N}-01-01"
                                                               (Use current calendar year.
                                                               Year precision is sufficient
                                                               when the patient gives only
                                                               age. Do not ask for the exact
                                                               date.)
            * "I had my checkup" / "my labs came back" /
              "here's my latest imaging report"             → save_record
            * "I want to keep this guideline/paper"         → save_to_library
        - Multiple disclosures in one message: call ONE tool per distinct
          health fact BEFORE writing any reply text. Example: "I was
          diagnosed with type 2 diabetes in 2020 and I've been on metformin
