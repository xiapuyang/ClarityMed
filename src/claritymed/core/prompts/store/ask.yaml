      (residence, birthplace) shape exposure history; four passive fields
      (marital_status, has_children, current_occupation, past_occupations)
      may be recorded if the user volunteers but the agent MUST NOT ask
      for them — a medical Q&A app feels intrusive fast. The Pydantic
      schema (PROACTIVE_PROFILE_FIELDS / PASSIVE_PROFILE_FIELDS) is the
      single source of truth; prompts mirror it for the model. Also
      teaches the model to record condition duration as
      (onset_date, end_date) when offered, not as free-text duration.
