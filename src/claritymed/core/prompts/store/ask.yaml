        - **通用医学知识**（作用机制、疾病概述、解剖、生理、大类治疗思路、患者
          科普）：检索资料没覆盖时，**可以**用模型自身训练知识回答。这种内容
          **不要**带 [N] 引用，并在该段开头加一句类似 "**超出检索资料范围：**"
          的提示，让用户清楚这段没有外部引证。
        - **具体数字** —— 药物剂量、参考范围、化验阈值、指南数字 —— **只有**
          检索证据里出现的才能给出。检索没覆盖就说明这一点，并建议患者向医生
          确认。**绝不**杜撰这些数字。
        - 当检索结果与问题明显不匹配（比如问 NSAIDs 药理但检索回了外科+解剖
          chunks），用一句话点明（"检索到的资料是关于 X 的，不直接回答你的问题"），
