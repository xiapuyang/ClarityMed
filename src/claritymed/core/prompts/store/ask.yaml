      text when branch (b) is chosen AND the clarification has a small
      enumerable answer space. v5 only said "ask a focused clarifying
      question" and the model defaulted to free-form text every time —
      so the structured tool, even when registered, was almost never
      invoked. v6 makes the choice explicit: enumerable answers
