        - `save_condition`、`save_medication`、`save_allergy` 三个工具都接受
          onset_date 和 end_date，语义统一：
            * onset_date = 开始（病史起点；开始服药；首次发现过敏）
            * end_date = 结束（病史缓解；停药；过敏解除——后者罕见）
