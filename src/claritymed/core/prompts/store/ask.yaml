  - version: v5
    created_at: 2026-06-11
    notes: |
      Graceful fallback to general medical knowledge when retrieval
      misses the question's actual topic. v4 over-trained the model to
      refuse outright whenever evidence did not perfectly cover the
      question — e.g. retrieval returned surgery + anatomy textbook
      chunks for an NSAID pharmacology question, and the model said
      "I cannot answer" instead of using its own training. v5 splits
      answer modes by claim type:
      - general medical knowledge → answer freely, no [N] needed, with
        an explicit "Beyond the retrieved sources" disclosure;
      - specific numbers (doses, reference ranges, guideline figures)
        → still strictly evidence-only, refuse if not cited;
      - each turn judges its topic independently (prior subject does
        not constrain what may be answered now).
    languages:
