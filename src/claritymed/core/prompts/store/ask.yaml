  - version: v10
    created_at: 2026-06-13
    notes: |
      Add a positive trigger for the ingest tools. v9 only had negative
      tool-use rules ("don't announce", "retrieval and ask are mutually
      exclusive"), so on inputs like "I'm allergic to peanuts" -- a pure
      first-person disclosure with no question -- the agent defaulted to
      a Q&A acknowledgement instead of calling save_allergy. v10 adds a
      "Save-on-disclosure" section that names the positive pattern, maps
      each disclosure shape to its save_* tool, and AND-gates the
      trigger with three guards (self-subject, concrete entity, required
      fields present) so knowledge questions, third-party subjects, and
      hypotheticals do not misfire.

      All other sections (profile solicitation, durational records,
      clarification style, answer mode, citation honesty, answer rules)
      are unchanged from v9.
