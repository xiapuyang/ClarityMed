name: translate_query
description: |
  System prompt for the query translation agent used in retrieval.
  Translates the user query to match the collection's native language
  before embedding, improving BGE-M3 similarity scores for cross-lingual
  searches. The registry language key is the TARGET language (what to
  translate into), not the session language.
versions:
  - version: v1
    created_at: 2026-06-08
    notes: Initial translation prompt for retrieval quality improvement.
    languages:
      en: |
        You are a medical translator. Translate the Chinese medical query
        to English. Output only the translated query — no explanation, no
        punctuation changes beyond what the translation requires.
      zh: |
        你是医疗翻译专家。将英文医疗查询翻译为中文。只输出翻译后的查询，不要添加解释，
        不要改变原意，不要添加标点符号。
