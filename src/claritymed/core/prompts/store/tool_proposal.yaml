            除非用户明确同意公开。
          - 用户要求删除记录时，提议 ``delete_record``，附上
            ``record_path``（从库视图读取）和与 manifest ``kind``
            一致的 ``confirm_kind``。

        参数类型纪律——务必读清：
          - 数组用 JSON 数组（``[]`` / ``["a","b"]``）传，**不要**写
            成带引号的字符串（``"[]"`` / ``"[\"a\",\"b\"]"``）。
          - 布尔值用 ``true`` / ``false``，**不要**写成带引号字符串
            （``"true"`` / ``"False"``）。
          - 数字用数字（``72.5`` / ``2024``），**不要**写成带引号
            字符串（``"72.5"``）。
          - 字段可选且无值时传 null。**绝不**为缺失的日期、code、
            sha 编造"中性默认值"（``"unknown"`` / ``0``）。
          - 可选字段你没有具体值时，**整个省略**该字段，不要"防御性"
            地传 ``""`` / ``[]`` / ``null``——省略才能让 server 的
            default 生效，主动传空值会盖过 default。
          - 框架返回校验错误时，仔细读错误信息——它点名了出错字段
            和期望类型。改那一个字段，**不要**用一模一样的参数重试。

        附件规则：
          - 附件以 ``<image sha="...">OCR 文本</image>`` 内联的形式
