name: save_allergy_tool
description: |
  Tool description shown to the LLM for ``save_allergy`` — append one
  allergy row to ``profile.db``. Allergies are profile-level facts; if
  the allergy was diagnosed during a specific visit and the report is
  attached, prefer ``save_record`` with an extracted_labs / notes entry
  AND a ``save_allergy`` call for the structured fact in the same turn.
versions:
  - version: v1
    created_at: 2026-06-12
    notes: |
      Initial version. Pin severity + source to the schema literals so
      a free-text value never reaches ProfileStore.
    languages:
      en: |
        Add one allergy to the user's profile.

        Field notes:
          - ``substance`` is the allergen (drug, food, environmental).
            Keep it as the user said it. Lowercase preferred but not
            required.
          - ``severity`` must be one of: ``mild``, ``moderate``,
            ``severe``, ``life_threatening``. If the user is vague
            ("I'm a bit allergic"), pick ``mild``; if they describe
            anaphylaxis or epinephrine, pick ``life_threatening``.
            Never invent a fifth value.
          - ``source`` must be one of: ``self_report`` (user said so),
            ``provider`` (a clinician told them), ``test`` (formal
            allergy test). Default to ``self_report`` when the user
            does not specify.
          - ``onset_date`` is when the allergy first appeared. Null if
            unknown.
          - ``end_date`` is when the allergy was resolved (rare —
            outgrown food allergies, desensitization). Almost always
            null.

        One call per allergen. Cross-reactive allergens (penicillin
        and amoxicillin) are still separate facts — propose two calls.
      zh: |
        把一条过敏记录加入用户画像。

        字段说明：
          - ``substance`` 是过敏原（药物、食物、环境）。按用户口语原样
            记录。建议小写但不强制。
          - ``severity`` 必须为以下之一：``mild`` / ``moderate`` /
            ``severe`` / ``life_threatening``。用户说得含糊（"有点过敏"）
            选 ``mild``；描述过敏性休克或自己用过肾上腺素笔，选
            ``life_threatening``。**不要**自创第五个值。
          - ``source`` 必须为以下之一：``self_report``（用户自述）/
            ``provider``（医生告知）/ ``test``（正式过敏检测）。用户
            没说就默认 ``self_report``。
          - ``onset_date`` 是首次出现过敏的日期。不知道就留 null。
          - ``end_date`` 是过敏已消解的日期（罕见——食物过敏自愈、
            脱敏治疗）。绝大多数情况留 null。

        一次调用对应一种过敏原。交叉过敏（青霉素与阿莫西林）也算两条
        独立事实——分两次调用。
  - version: v2
    created_at: 2026-06-12
    notes: |
      Fix enum values (source: self_report|clinical_record; severity:
      anaphylactic). Add dedup guard: check [Patient profile] block before
      calling to avoid redundant tool invocations.
    languages:
      en: |
        Add one allergy to the user's profile.

        Before calling: check the ``[Patient profile]`` block in the current
        context. If the allergen (case-insensitive) is already listed as active
        (no end date shown), skip this call — the tool returns
        ``{"ok": false, "reason": "no_change"}``. Only call when the substance
        is new to the profile, or the previous entry was resolved (has an end
        date) and the allergy has recurred.

        Field notes:
          - ``substance`` is the allergen (drug, food, environmental).
            Keep it as the user said it. Lowercase preferred but not required.
          - ``severity`` must be one of: ``mild``, ``moderate``, ``severe``,
            ``anaphylactic``. If the user is vague ("a bit allergic"), pick
            ``mild``; if they describe anaphylaxis or carry an epinephrine
            auto-injector, pick ``anaphylactic``. Never invent another value.
          - ``source`` must be one of: ``self_report`` (user says so),
            ``clinical_record`` (documented by a clinician or test result).
            Default to ``self_report`` when the user does not specify.
          - ``onset_date`` is when the allergy first appeared. Null if unknown.
          - ``end_date`` is when the allergy resolved (outgrown food allergy,
            desensitization). Almost always null.

        One call per allergen. Cross-reactive allergens (penicillin and
        amoxicillin) are separate facts — propose two calls.
      zh: |
        把一条过敏记录加入用户画像。

        调用前：检查当前上下文里的 ``[Patient profile]`` 块。如果该过敏原
        （忽略大小写）已经以活跃状态（无结束日期）列出，**跳过此次调用**——
        工具会返回 ``{"ok": false, "reason": "no_change"}``。仅当该物质对用户
        来说是新的，或之前的记录已经标记为结束（有 end_date）且过敏复发时
        才调用。

        字段说明：
          - ``substance`` 是过敏原（药物、食物、环境）。按用户口语原样记录。
            建议小写但不强制。
          - ``severity`` 必须为以下之一：``mild`` / ``moderate`` / ``severe`` /
            ``anaphylactic``。用户说得含糊（"有点过敏"）选 ``mild``；描述过
            敏性休克或自己用过肾上腺素笔，选 ``anaphylactic``。**不要**自创其他值。
          - ``source`` 必须为以下之一：``self_report``（用户自述）/
            ``clinical_record``（由医生或检测报告记录）。用户没说就默认
            ``self_report``。
          - ``onset_date`` 是首次出现过敏的日期。不知道就留 null。
          - ``end_date`` 是过敏已消解的日期（食物过敏自愈、脱敏治疗）。
            绝大多数情况留 null。

        一次调用对应一种过敏原。交叉过敏（青霉素与阿莫西林）也算两条
        独立事实——分两次调用。
  - version: v3
    created_at: 2026-06-13
    notes: |
      Harden the dedup guard. v2's "skip this call — the tool returns
      no_change" gave the model a safety blanket: in the fp_repeat_allergy
      en trial the model said "let me verify this is already recorded"
      and then called save_allergy as a probe. v3 reframes the guard as
      a hard prohibition at the TOP of the description and removes the
      "no_change" reassurance so the tool is never treated as a cheap
      verification step.
    languages:
      en: |
        Add one allergy to the user's profile. This is a WRITE — calling
        it appends a row. Never call it to "verify" or "confirm" data
        that is already visible in the ``[Patient profile]`` block.

        Hard guard — read this FIRST, before considering args:
        If the ``[Patient profile]`` block in the current context already
        lists the user as allergic to this substance (case-insensitive
        match) with no end_date, DO NOT call this tool. Acknowledge the
        existing record in your reply and stop. Re-stating an already-
        recorded allergy is not a reason to call save_allergy.

        Anti-pattern to avoid: thinking "let me just call save_allergy
        to double-check / verify / refresh the entry". The tool is the
        write — there is no read mode. The profile block IS the read.

        Only call when one of these is true:
          (a) the substance does not appear in the profile block, OR
          (b) the previous entry was resolved (has an end_date) and the
              allergy has recurred.

        Field notes:
          - ``substance`` is the allergen (drug, food, environmental).
            Keep it as the user said it. Lowercase preferred but not required.
          - ``severity`` must be one of: ``mild``, ``moderate``, ``severe``,
            ``anaphylactic``. If the user is vague ("a bit allergic"), pick
            ``mild``; if they describe anaphylaxis or carry an epinephrine
            auto-injector, pick ``anaphylactic``. Never invent another value.
          - ``source`` must be one of: ``self_report`` (user says so),
            ``clinical_record`` (documented by a clinician or test result).
            Default to ``self_report`` when the user does not specify.
          - ``onset_date`` is when the allergy first appeared. Null if unknown.
          - ``end_date`` is when the allergy resolved (outgrown food allergy,
            desensitization). Almost always null.

        One call per allergen. Cross-reactive allergens (penicillin and
        amoxicillin) are separate facts — propose two calls.
      zh: |
        把一条过敏记录加入用户画像。这是**写操作**——调用即追加一行。
        **绝不**用它去"验证"或"确认"那些已经在 ``[Patient profile]`` 块
        里能看到的数据。

        硬性前置检查（必须先读这一段，再考虑参数）：
        如果当前上下文的 ``[Patient profile]`` 块里已经列出用户对该过敏原
        （忽略大小写）活跃过敏（无 end_date），**不要**调用此工具。在回复
        里承认已有记录然后停下。**重复陈述一条已有的过敏不是调 save_allergy
        的理由。**

        要避免的反模式：心里冒出"我去调一下 save_allergy 双重验证 / 刷新一下
        记录"的念头——这条工具**只有写、没有读**。Profile 块就是读。

        仅当下列之一成立时才调用：
          (a) profile 块里没出现该过敏原；或
          (b) 之前的记录已标记结束（有 end_date）且过敏复发。

        字段说明：
          - ``substance`` 是过敏原（药物、食物、环境）。按用户口语原样记录。
            建议小写但不强制。
          - ``severity`` 必须为以下之一：``mild`` / ``moderate`` / ``severe`` /
            ``anaphylactic``。用户说得含糊（"有点过敏"）选 ``mild``；描述过
            敏性休克或自己用过肾上腺素笔，选 ``anaphylactic``。**不要**自创其他值。
          - ``source`` 必须为以下之一：``self_report``（用户自述）/
            ``clinical_record``（由医生或检测报告记录）。用户没说就默认
            ``self_report``。
          - ``onset_date`` 是首次出现过敏的日期。不知道就留 null。
          - ``end_date`` 是过敏已消解的日期（食物过敏自愈、脱敏治疗）。
            绝大多数情况留 null。

        一次调用对应一种过敏原。交叉过敏（青霉素与阿莫西林）也算两条
        独立事实——分两次调用。
  - version: v4
    created_at: 2026-06-13
    notes: |
      Add a hard severity guard. v3 still let the model infer "moderate"
      when the user said only "I get a reaction every time" with no
      intensity cue, because the field-notes line "vague → mild" was
      treated as a free default. v4 reframes severity as a structured
      enum that MUST be derived from an explicit user signal: if none
      of the named signal phrases appear (mild / itchy / hives / swelling
      / breathing trouble / anaphylaxis / epi-pen / hospital), the model
      must call `ask_user_question` with the four-tier picker BEFORE
      save_allergy. Defaulting silently to ``moderate`` is now wrong.
      The dedup guard from v3 is unchanged.
    languages:
      en: |
        Add one allergy to the user's profile. This is a WRITE — calling
        it appends a row. Never call it to "verify" or "confirm" data
        that is already visible in the ``[Patient profile]`` block.

        Hard guard #1 — dedup. Read this FIRST, before considering args:
        If the ``[Patient profile]`` block in the current context already
        lists the user as allergic to this substance (case-insensitive
        match) with no end_date, DO NOT call this tool. Acknowledge the
        existing record in your reply and stop. Re-stating an already-
        recorded allergy is not a reason to call save_allergy.

        Anti-pattern to avoid: thinking "let me just call save_allergy
        to double-check / verify / refresh the entry". The tool is the
        write — there is no read mode. The profile block IS the read.

        Hard guard #2 — severity must be EXPLICIT, not defaulted:
        ``severity`` is a clinical field that drives downstream decisions
        (epi-pen alerts, prescribing locks). The user must have given
        you a concrete signal — silently defaulting to ``moderate`` is
        wrong. Map only these signals:
          - "mild" / "a little" / "itchy" / "rash"        → ``mild``
          - "moderate" / "swelling" / "hives" / "wheezing"→ ``moderate``
          - "severe" / "trouble breathing" / "ER visit"   → ``severe``
          - "anaphylaxis" / "anaphylactic" / "epi-pen" /
            "epinephrine" / "shock"                       → ``anaphylactic``
        If the user said only that they react / get a reaction / are
        allergic, WITHOUT one of those signals, DO NOT call save_allergy
        yet. First call `ask_user_question` with severity options
        (mild / moderate / severe / anaphylactic), then save once the
        patient answers. "I get a reaction every time" alone is not a
        severity signal — it tells you the allergy is repeated, not how
        bad it is.

        Only call when ALL of these are true:
          (a) the substance does not already appear active in the profile
              block (or a previous entry has end_date and the allergy has
              recurred), AND
          (b) severity is anchored to one of the named signals above.

        Field notes:
          - ``substance`` is the allergen (drug, food, environmental).
            Keep it as the user said it. Lowercase preferred but not required.
          - ``severity`` must be one of: ``mild``, ``moderate``, ``severe``,
            ``anaphylactic``. See guard #2 — never invent and never default.
          - ``source`` must be one of: ``self_report`` (user says so),
            ``clinical_record`` (documented by a clinician or test result).
            Default to ``self_report`` when the user does not specify.
          - ``onset_date`` is when the allergy first appeared. Null if unknown.
          - ``end_date`` is when the allergy resolved (outgrown food allergy,
            desensitization). Almost always null.

        One call per allergen. Cross-reactive allergens (penicillin and
        amoxicillin) are separate facts — propose two calls.
      zh: |
        把一条过敏记录加入用户画像。这是**写操作**——调用即追加一行。
        **绝不**用它去"验证"或"确认"那些已经在 ``[Patient profile]`` 块
        里能看到的数据。

        硬性前置检查 #1 —— 去重。必须先读这一段，再考虑参数：
        如果当前上下文的 ``[Patient profile]`` 块里已经列出用户对该过敏原
        （忽略大小写）活跃过敏（无 end_date），**不要**调用此工具。在回复
        里承认已有记录然后停下。**重复陈述一条已有的过敏不是调 save_allergy
        的理由。**

        要避免的反模式：心里冒出"我去调一下 save_allergy 双重验证 / 刷新一下
        记录"的念头——这条工具**只有写、没有读**。Profile 块就是读。

        硬性前置检查 #2 —— severity 必须**显式**来自用户原话，不允许默认：
        ``severity`` 是一个临床字段，会影响下游决策（epi-pen 提醒、处方
        拦截）。用户必须给出**具体信号**——默默兜底成 ``moderate`` 就是
        错的。只能映射以下信号：
          - "有点"/"轻微"/"痒"/"出疹"                 → ``mild``
          - "中度"/"肿胀"/"风团"/"喘"                 → ``moderate``
          - "严重"/"喘不过气"/"急诊"                  → ``severe``
          - "过敏性休克"/"上过肾上腺素笔"/"休克"      → ``anaphylactic``
        如果用户只说"过敏 / 有反应 / 每次都反应"而**没有**上述任一信号，
        **不要**先调 save_allergy。**先**调 `ask_user_question` 给出严重度
        四档选项（mild / moderate / severe / anaphylactic），拿到回答再
        save。"每次接触都有反应"本身**不是**严重度信号——它说明过敏在
        反复触发，但没说有多重。

        当且仅当下列**全部**成立时才调用：
          (a) profile 块里没出现该过敏原活跃记录（或之前的记录已 end_date
              且过敏复发）；且
          (b) severity 锚定在上面列出的某个具体信号上。

        字段说明：
          - ``substance`` 是过敏原（药物、食物、环境）。按用户口语原样记录。
            建议小写但不强制。
          - ``severity`` 必须为以下之一：``mild`` / ``moderate`` / ``severe`` /
            ``anaphylactic``。见检查 #2——既不要自创、也不要默认。
          - ``source`` 必须为以下之一：``self_report``（用户自述）/
            ``clinical_record``（由医生或检测报告记录）。用户没说就默认
            ``self_report``。
          - ``onset_date`` 是首次出现过敏的日期。不知道就留 null。
          - ``end_date`` 是过敏已消解的日期（食物过敏自愈、脱敏治疗）。
            绝大多数情况留 null。

        一次调用对应一种过敏原。交叉过敏（青霉素与阿莫西林）也算两条
        独立事实——分两次调用。
