  - version: v3
    created_at: 2026-06-17
    notes: |
      Field-reported failure: with a properly-tagged medical scan
      (``modality="ultrasound" is_medical="true" ocr_has_report="false"
      ocr_status="empty"``) and a user prompt "分析这个" the model
      wrote prose explanations and asked clarifying questions in
      Markdown instead of either calling ``detect_disease_from_image``
      OR ``ask_user_question``. Two contributing factors traced to v2:

      1. v2 had no ``ocr_status`` note. Models read the empty status
         as a blocker even though the pixels are the whole point of a
         diagnostic scan — clinicians don't write text on a B-mode
         ultrasound.
      2. v2's Rule 4 said "emit askuserquestion" but didn't make
         clear that "emit" means **call the tool**. The model
         interpreted it as "write a clarifying question in prose"
         and produced Markdown checkboxes.

      v3 changes (vs v2):
      * Adds an attribute preamble. ``ocr_status="empty"`` is NORMAL
         for diagnostic scans — explicit instruction not to wait for
         OCR or refuse on that basis.
      * Splits the intent gate into STRONG vs VAGUE:
        - STRONG intent ("analyze this breast US", "is this lesion
           concerning?", "BI-RADS?") → Rule 3, call the tool.
        - VAGUE intent ("分析这个", "看一下", "thoughts?", empty
           prompt) → Rule 4, **call** ``ask_user_question`` to
           confirm the disease. v3 keeps this branch (an early
           draft tried to collapse it into Rule 3 but the user
           confirmed vague-prompt-→-disambig is the desired UX).
      * Adds an explicit "call the tool, NOT prose" warning under
         Rule 4 since that was the v2 failure mode. Names a
         counter-example (Markdown checkboxes).
      * Two worked examples — one for each branch — on the exact tag
         shape from the v2 bug report.
    languages:
      en: |
        Run a vision model on an attached medical image to produce a
        structured detection payload (probabilities per label, cancer
        status, recommended clinical action, optional segmentation).

        The plugin owns confirmation, modality validation, fallback
        flow, and the result transform. You receive one structured
        ``dict`` per call and compose the user-facing reply per
        ``vision_final_reply.yaml``.

        Covered diseases:
        {covered_diseases}

        BEFORE deciding, read every ``<image>`` tag's attributes.
        Important attribute notes:

        * ``ocr_status="empty"`` is NORMAL for diagnostic scans.
          Ultrasounds, CTs, dermoscopy photos, and histopath slides
          rarely contain printed text — the pixels ARE the diagnostic
          content. Do NOT treat ``ocr_status="empty"`` as a reason
          to refuse, ask for OCR text, or "wait for OCR to complete".
        * ``ocr_status="done"`` with text content present means the
          OCR returned a clinician-style report — use rule 2 in that
          case (see ``ocr_has_report``).
        * Absent ``modality`` / ``is_medical`` attributes mean the
          classifier had no signal — fall to rule 6.

        ROUTING RULES.

          1. ``is_medical="false"`` OR ``modality="document"`` →
             do NOT call this tool. Answer via normal RAG / free
             text — the image is not a clinical scan.

          2. ``ocr_has_report="true"`` → do NOT call this tool.
             The OCR already extracted a clinician's reading, which
             is authoritative; answer from the report text. (The
             tool body also short-circuits this case, but reaching
             that step wastes a tool call.)

          3. **STRONG diagnostic intent on a tag-matched scan** —
             ``is_medical="true"`` + ``ocr_has_report="false"`` +
             ``modality`` matches one of the covered diseases'
             accepted modalities + the user **explicitly named the
             condition, organ, or asked a diagnostic question** →
             **call** ``detect_disease_from_image`` with the matching
             ``disease_id`` and the ``image_sha`` from the
             ``<image>`` tag.

             Examples of STRONG intent (call the tool):
             * "analyze this breast ultrasound"
             * "is this lesion concerning?"
             * "what's the BI-RADS on this?"
             * "could this be malignant?"
             * "run the breast cancer model on this"
             * "分析这张乳房彩超"
             * "这个结节有问题吗？"

          4. **VAGUE intent on a tag-matched scan** —
             ``is_medical="true"`` + ``ocr_has_report="false"`` +
             ``modality`` matches a covered disease, BUT the user's
             text doesn't pin down what they want analyzed (one-word
             prompt, generic gesture, free-form anxiety, empty
             prompt) → **CALL the ``ask_user_question`` tool** with
             title and body from ``vision.disambig.disease`` and
             options filtered to diseases whose ``accepted_modality``
             matches the ``<image>`` tag.

             Examples of VAGUE intent (ask via the tool):
             * "分析这个" / "看一下" / "帮我看看"
             * "thoughts?" / "what do you think?"
             * "这张图怎么样" / "有问题吗"
             * empty prompt — just the image, no text

             **CRITICAL — call the tool, do NOT write prose.**
             "Call ``ask_user_question``" means **invoke the tool
             with structured arguments**. It does NOT mean:
             * writing Markdown bullets with ``- [ ]`` checkboxes
             * writing "Please pick one of: …" in free text
             * narrating "I'd like to ask you which condition…"
             A Markdown checkbox list is the v2 failure mode this
             rule exists to prevent. Issue an actual tool call;
             stop generating and wait for the user's pick.

          5. ``modality="unknown"`` (the modality classifier was
             low-confidence) → **call ``ask_user_question``** with
             title and body from ``vision.disambig.modality``. After
             the user answers, treat the image as if the chosen
             modality were the tagged one for the next turn. Same
             "call the tool, not prose" rule from Rule 4 applies.

          6. ``ocr_status="empty"`` AND the tag has NO ``modality``
             attribute AND NO ``is_medical`` attribute (classifier
             signal completely unavailable) → **call
             ``ask_user_question``** with title and body from
             ``vision.disambig.disease`` and options set to ALL
             covered diseases (no modality filter is possible).
             Same "call the tool, not prose" rule applies.

        Worked examples (same tag, two intents):

        Tag in both examples:
            ``<image sha="abc..." modality="ultrasound"
              is_medical="true" ocr_has_report="false"
              ocr_status="empty"/>``

        Example A — STRONG intent → Rule 3:
          User: "please analyze this breast ultrasound" / "is this
          breast lesion concerning?" / "分析这张乳房超声"
          → Call ``detect_disease_from_image(
                disease_id="breast_cancer_ultrasound",
                image_sha="abc...")``.
          Do NOT explain BI-RADS first, do NOT ask the user to
          confirm consent — the plugin's confirm modal handles that.

        Example B — VAGUE intent → Rule 4:
          User: "分析这个" / "thoughts?" / empty prompt
          → Call ``ask_user_question`` with a single question whose
          ``options`` are the covered diseases whose
          ``accepted_modality`` is ``ultrasound``. Stop generating
          and wait for the user's pick. Do NOT write Markdown
          checkboxes; do NOT explain modalities in prose.

        Argument contract:
          - ``disease_id`` (required) — must equal one of the covered
            diseases above.
          - ``image_sha`` (required) — copy the ``sha=...`` attribute
            from the ``<image>`` tag verbatim. Truncated prefixes are
            rejected.
          - ``model_id_hint`` (optional) — pass only when the user
            explicitly named a model. Otherwise omit and let the
            plugin pick ``DiseaseSpec.primary_model_id``.

        Return-value branches (``kind`` field on the returned dict):
          - ``"detection"`` — normal result. Compose per
            ``vision_final_reply.yaml`` — branch on ``clinical_action``.
          - ``"ocr_override"`` — answer from the OCR report instead.
          - ``"modality_mismatch"`` — the model's accepted modality
            does not match the image. Apologize, explain the
            mismatch from ``model_accepts`` / ``image_modality``, and
            offer to retry with a correctly-typed image.
          - ``"not_medical"`` — the image is not a clinical scan;
            answer the user's question without this tool.
          - ``"user_declined"`` — the user said no on the confirm
            modal; respect that and continue without inference.
          - ``"unknown_disease"`` — your ``disease_id`` is not in the
            catalog. Re-emit the ``ask_user_question`` from rule 4
            with the list in ``available``.
          - ``"missing_attachment"`` — your ``image_sha`` does not
            resolve to a session attachment. Ask the user to re-paste
            the image.
          - ``"no_usable_result"`` — every model in the fallback flow
            returned low-confidence within the budget. Surface the
            ``warnings`` to the user and recommend a clinician review.

        DO NOT call this tool when no ``<image>`` tag is present in
        the current turn. DO NOT pass an ``image_sha`` that does not
        appear in a ``<image>`` tag — making one up will fail loudly
        and waste a turn.
      zh: |
        对一张附加的医学影像运行视觉模型，返回结构化的检测结果（每个
        标签的概率、癌症状态、建议的临床动作、可选的分割掩码）。

        插件负责确认、模态校验、回退流程和结果裁剪。每次调用你都会
        收到一个结构化 ``dict``，再根据 ``vision_final_reply.yaml``
        组织面向用户的回复。

        已覆盖的疾病:
        {covered_diseases}

        调用本工具之前，请先读每个 ``<image>`` 标签上的属性。属性说明：

        * ``ocr_status="empty"`` 对**诊断影像**而言是正常状态。
          超声、CT、皮肤镜、组织病理切片几乎都不包含可读文字 ——
          像素本身就是诊断内容。**不要**把 ``ocr_status="empty"``
          当作拒答理由、不要索要 OCR 文字、也不要"等 OCR 完成"。
        * ``ocr_status="done"`` 且标签内含 OCR 文本 = OCR 提取出
          了医生出具的报告，按规则 2 走（见 ``ocr_has_report``）。
        * 标签上**没有** ``modality`` / ``is_medical`` 属性 = 分类器
          没拿到信号，按规则 6 走。

        路由规则：

          1. ``is_medical="false"`` 或 ``modality="document"`` →
             **不要**调用本工具。这不是一张临床影像，按普通 RAG/
             自由文本回答。

          2. ``ocr_has_report="true"`` → **不要**调用本工具。
             OCR 已经提取了医生出具的诊断报告，那是权威结果，
             直接根据报告文本作答即可。（工具内部也会兜底拦截，
             但走到那一步等于浪费了一次工具调用。）

          3. **标签匹配 + 用户意图明确** ——
             ``is_medical="true"`` + ``ocr_has_report="false"`` +
             ``modality`` 与某个已覆盖疾病的 ``accepted_modality``
             匹配 + 用户**明确点名了疾病、器官，或提出了诊断性
             问题** → **调用** ``detect_disease_from_image``，
             ``disease_id`` 选对应的疾病，``image_sha`` 从
             ``<image>`` 标签里复制。

             明确意图的例子（直接调工具）：
             * "分析这张乳房彩超"
             * "这个结节有问题吗？"
             * "BI-RADS 几级？"
             * "可能是恶性吗？"
             * "用乳腺癌模型跑一下"
             * "analyze this breast ultrasound"
             * "is this lesion concerning?"

          4. **标签匹配但用户意图模糊** ——
             ``is_medical="true"`` + ``ocr_has_report="false"`` +
             ``modality`` 匹配某个已覆盖疾病，但用户文本没有
             点明想分析什么（一两个字的提问、一段焦虑情绪、
             模糊的部位、空提问）→ **调用 ``ask_user_question``
             工具**，标题与正文取自 ``vision.disambig.disease``，
             可选项过滤为 ``accepted_modality`` 与当前图像匹配
             的疾病。

             意图模糊的例子（通过工具追问）：
             * "分析这个" / "看一下" / "帮我看看"
             * "这张图怎么样" / "有问题吗"
             * "thoughts?" / "what do you think?"
             * 空提问 —— 只有图像，没有任何文字

             **关键 —— 调用工具，不要写文字。**"调用
             ``ask_user_question``" 意味着**实际发起工具调用并
             带上结构化参数**。它**不是**指：
             * 用 Markdown 写 ``- [ ]`` 复选框
             * 用文字写"请从以下选项中选一个：..."
             * 自言自语"我想问您是想检查哪种情况"
             用 Markdown 复选框就是 v2 失败的失败模式，本规则
             的存在就是为了防它。**发起真正的工具调用、停止
             生成、等用户作答**。

          5. ``modality="unknown"``（模态分类置信度过低）→ **调用
             ``ask_user_question`` 工具**，标题与正文取自
             ``vision.disambig.modality``。用户选定后，把当前图像
             视为该模态的图像并据此判断是否调用工具。规则 4 的
             "调用工具、不要写文字"同样适用。

          6. ``ocr_status="empty"`` 且标签上**既没有** ``modality``
             属性 **也没有** ``is_medical`` 属性（分类器信号完全
             缺失）→ **调用 ``ask_user_question`` 工具**，标题
             与正文取自 ``vision.disambig.disease``，选项给出
             **全部**已覆盖疾病。规则 4 的"调用工具、不要写
             文字"同样适用。

        两个真实案例（同一个标签，两种意图）：

        两个例子共用的标签：
            ``<image sha="abc..." modality="ultrasound"
              is_medical="true" ocr_has_report="false"
              ocr_status="empty"/>``

        案例 A —— 意图明确 → 命中规则 3：
          用户："分析这张乳房超声" / "这个结节有问题吗？" /
          "is this breast lesion concerning?"
          → 调用 ``detect_disease_from_image(
                disease_id="breast_cancer_ultrasound",
                image_sha="abc...")``。
          **不要**先讲 BI-RADS、**不要**问家族史、**不要**自己
          再确认一遍 —— 插件的确认弹窗会处理用户确认。

        案例 B —— 意图模糊 → 命中规则 4：
          用户："分析这个" / "thoughts?" / 干脆什么都不说
          → 调用 ``ask_user_question``，单个问题，``options``
          列出 ``accepted_modality`` 为 ``ultrasound`` 的已
          覆盖疾病。停止生成、等用户选。**不要**用 Markdown
          列复选框，**不要**用文字解释模态。

        参数约定：
          - ``disease_id``（必填）：必须是上面已覆盖疾病之一。
          - ``image_sha``（必填）：直接复制 ``<image sha="...">`` 中
             的完整哈希；截断的前缀会被拒绝。
          - ``model_id_hint``（可选）：只有当用户明确指定某个模型时
             才传；默认省略，由插件选 ``DiseaseSpec.primary_model_id``。

        返回值 ``kind`` 字段对应的分支：
          - ``"detection"``：正常结果。按 ``vision_final_reply.yaml``
             根据 ``clinical_action`` 组织回答。
          - ``"ocr_override"``：改为根据 OCR 报告作答。
          - ``"modality_mismatch"``：模型接受的模态与图像模态不一致。
             致歉并解释 ``model_accepts`` / ``image_modality``，
             建议用户改换合适的图像再试。
          - ``"not_medical"``：图像不是临床影像；忽略工具，
             正常回答用户的问题。
          - ``"user_declined"``：用户在确认弹窗中选择"不"，
             尊重选择，不再调用模型。
          - ``"unknown_disease"``：你给的 ``disease_id`` 不在目录里。
             用 ``available`` 列表重新发起规则 4 的 ``ask_user_question``。
          - ``"missing_attachment"``：``image_sha`` 找不到对应的会话
             附件，请用户重新粘贴图像。
          - ``"no_usable_result"``：回退链路里的每个模型都低置信度，
             把 ``warnings`` 告诉用户并建议线下找临床医生复核。

        若当前轮没有 ``<image>`` 标签，**不要**调用本工具。
        不要凭空编造 ``image_sha`` —— 会失败并浪费一轮对话。
