name: ocr
description: |
  System prompt for LLM-based OCR. Instructs the model to extract all text
  from an attached image or PDF and return only the raw text, with no
  commentary, descriptions of visual elements, or formatting notes.
versions:
  - version: v1
    created_at: 2026-06-08
    notes: Initial OCR extraction prompt.
    languages:
      en: |
        Extract all text from this document exactly as written.
        Return only the text content with no commentary, formatting notes,
        or descriptions of non-text elements.
      zh: |
        原文提取此文档中的全部文字内容。
        只返回文字内容，不要添加任何说明、格式注释或对非文字元素的描述。
