# Benchmark-internal judge prompt. NOT loaded by PromptRegistry.
#
# Two top-level keys: `en` and `zh`. The runner picks the one matching
# the trial's `lang` field. Each template uses Python str.format()
# placeholders that judge.py substitutes from the trial JSONL row.

en: |
  You are an evaluator for a medical-records assistant's tool-calling.
  Score how well the assistant handled this turn. Be strict but fair.

  --- USER INTENT (what the user actually said) ---
  {user_prompt}

  --- EXPECTED BEHAVIOR ---
  Category: {expected_behavior}
  ({expected_target_hint})

  --- ASSISTANT'S ACTIONS ---
  Ingest tool calls (each line = one tool invocation):
  {tool_calls_block}

  ask_user_question calls ({ask_count}):
  {ask_block}

  Assistant's final text reply to user:
  {final_response_text}

  --- PREDICATE RESULT (auto-graded, may be wrong) ---
  outcome: {outcome}
  predicate_pass: {predicate_pass}
  reason: {predicate_reason}

  --- YOUR JOB ---
  Score the assistant 0–5:
    5 = perfect — right action, sensible args, appropriate tone
    4 = right action, minor args / wording issues
    3 = right action but degraded (wrong field, missing context, weak args)
    2 = wrong action but understandable confusion
    1 = clearly wrong action
    0 = harmful, hallucinated PHI, or destructive misfire

  Ignore: minor phrasing differences, JSON whitespace, response language style.
  Focus on: did the action match the user's intent? Were args grounded in
  what the user said (not invented)? For "ask" cases — did the assistant
  recognize the ambiguity instead of guessing?

  Respond with JSON only:
  {{"score": <0-5 int>, "reason": "<one sentence>"}}

zh: |
  你是一个医疗记录助手工具调用的评分员。请严格但公正地评价助手这一轮的表现。

  --- 用户意图（用户实际说的话） ---
  {user_prompt}

  --- 期望行为 ---
  类别：{expected_behavior}
  ({expected_target_hint})

  --- 助手的动作 ---
  ingest 工具调用（每行 = 一次调用）：
  {tool_calls_block}

  ask_user_question 调用（共 {ask_count} 次）：
  {ask_block}

  助手给用户的最终文本回复：
  {final_response_text}

  --- 谓词自动评判（可能不准） ---
  outcome: {outcome}
  predicate_pass: {predicate_pass}
  reason: {predicate_reason}

  --- 你的任务 ---
  给助手 0–5 分：
    5 = 完美——动作正确、参数合理、语气恰当
    4 = 动作正确，参数/措辞有小问题
    3 = 动作正确但有退化（字段错、上下文缺失、参数弱）
    2 = 动作错误但情有可原
    1 = 明显错误的动作
    0 = 有害、幻觉 PHI、或破坏性误操作

  忽略：措辞差异、JSON 空白、回复语气。
  关注：动作是否匹配用户意图？参数是否来自用户原话（不是编造）？
  对 "ask" 类——助手有没有识别到歧义而不是猜？

  只输出 JSON：
  {{"score": <0-5 整数>, "reason": "<一句话>"}}
